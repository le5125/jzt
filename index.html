    async function submitReply(reply) {
      if (!selectedNote || replyingInProgress) return;

      replyingInProgress = true;
      updateReplySubmitState();
      const prevSubmitLabel = els.submitReplyButton.textContent;
      els.submitReplyButton.textContent = "送出中…";

      const newReply = {
        id: crypto.randomUUID(),
        authorUid: currentUserId,
        type: reply.type,
        content: reply.content,
        createdAt: new Date().toISOString()
      };

      selectedReplies.unshift(newReply);
      repliesCache.set(selectedNote.id, [...selectedReplies]);
      updateReplyEntryCount();
      renderReplies();

      try {
        await saveReply(selectedNote, newReply);
        selectedNote.replyCount = (selectedNote.replyCount || 0) + 1;
        selectedNote.lastActivityAt = newReply.createdAt;
        const noteIndex = notes.findIndex((item) => item.id === selectedNote.id);
        if (noteIndex >= 0) {
          notes[noteIndex] = { ...notes[noteIndex], ...selectedNote };
          notes = sortNotesByActivity(notes);
          saveNotesCache();
        }
        els.pickedCount.textContent = `${selectedNote.pickedCount} 次`;
        updatePickedTimes(selectedNote);
        updateReplyEntryCount();
        renderReplies();
        renderNotes();
        updateReplyAlert();
        showToast("已送出回覆");
      } catch (error) {
        console.error("[回覆] 送出失敗", error);
        selectedReplies = selectedReplies.filter((item) => item.id !== newReply.id);
        repliesCache.set(selectedNote.id, [...selectedReplies]);
        renderReplies();
        updateReplyEntryCount();
        showToast(error?.message?.includes("逾時") ? error.message : "回覆失敗，請稍後再試");
      } finally {
        replyingInProgress = false;
        els.submitReplyButton.textContent = prevSubmitLabel;
        updateReplySubmitState();
      }
    }

    function loadNotesCacheFrom(key) {

        if (Date.now() - (parsed.savedAt || 0) > 7 * 24 * 60 * 60 * 1000) return null;
        return parsed.notes;
      } catch {

    /**
     * 優先 Firebase Storage（https 網址）；失敗時 demo 模式改 B64
     */
    async function uploadNoteImage(file) {
      const unsupported = /heic|heif/i.test(file.type || file.name || "");
      if (unsupported) {
        throw new Error("HEIC 格式不支援，請在相簿選「相容格式」或改用 JPG");
      }

      const dataUrl = await compressImageToDataUrl(file, 800, 0.68);
      const sizeKb = Math.round(dataUrl.length * 0.75 / 1024);
      console.log(`[圖片] 壓縮後約 ${sizeKb} KB`);

      if (hasFirebase && firebaseApi?.storage) {
        try {
          const url = await uploadImageToStorage(dataUrl);
          console.log("[圖片] Storage 上傳成功");
          return url;
        } catch (err) {
          console.warn("[圖片] Storage 上傳失敗，改用 B64", err);
        }
      }

      if (dataUrl.length > 700 * 1024) {
        throw new Error(`圖片壓縮後仍太大（${sizeKb} KB），請換一張較小的圖`);
      }
      return dataUrl;
    }

    async function uploadImageToStorage(dataUrl) {
      const { storageModule, storage } = firebaseApi;
      const { ref, uploadString, getDownloadURL } = storageModule;
      const path = `notes/${currentUserId}/${Date.now()}_${crypto.randomUUID()}.jpg`;
      const storageRef = ref(storage, path);
      await withTimeout(
        uploadString(storageRef, dataUrl, "data_url", { contentType: "image/jpeg" }),
        25000,
        "圖片上傳逾時，請檢查網路"
      );
      return await getDownloadURL(storageRef);
    }

    async function compressImageToDataUrl(file, maxSide = 800, quality = 0.68) {
      if (typeof createImageBitmap === "function") {
        try {
          const bitmap = await createImageBitmap(file);
          const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
          const width = Math.max(1, Math.round(bitmap.width * scale));
          const height = Math.max(1, Math.round(bitmap.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bitmap, 0, 0, width, height);
          bitmap.close?.();
          return canvas.toDataURL("image/jpeg", quality);
        } catch (err) {
          console.warn("[圖片] createImageBitmap 失敗，改用傳統方式", err);
        }
      }

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        const timer = setTimeout(() => {
          reject(new Error("讀取圖片逾時，請換一張較小的圖"));
        }, 15000);

        reader.onerror = () => {
          clearTimeout(timer);
          reject(new Error("無法讀取圖片"));
        };
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => {
            clearTimeout(timer);
            reject(new Error("圖片格式不支援，請改用 JPG 或 PNG"));
          };
          img.onload = () => {
            clearTimeout(timer);
            try {
              let { width, height } = img;
              if (width > maxSide || height > maxSide) {
                if (width > height) {
                  height = Math.round(height * maxSide / width);
                  width = maxSide;
                } else {
                  width = Math.round(width * maxSide / height);
                  height = maxSide;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL("image/jpeg", quality));
            } catch (err) {
              reject(new Error("圖片壓縮失敗，請換一張"));
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function mapReplyDoc(doc) {
      const data = doc.data();
      return {
        id: doc.id,
        authorUid: data.authorUid,
        type: data.type,
        content: data.content,
        createdAt: data.createdAt?.toDate?.().toISOString() || new Date().toISOString()

    function sortReplies(replies) {
      return [...replies].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }

    function stopRepliesListener() {
      repliesListenerToken++;
      if (repliesUnsubscribe) {
        repliesUnsubscribe();
        repliesUnsubscribe = null;
      }
      repliesListenerNoteId = null;
    }

    function applyRepliesForNote(noteId, replies) {
      const sorted = sortReplies(replies);
      repliesCache.set(noteId, sorted);
      if (selectedNote?.id !== noteId) return;
      selectedReplies = sorted;
      updateReplyEntryCount();
      renderRepliesIfOpen();
    }

    function renderRepliesIfOpen() {
      if (els.replySheet?.classList.contains("open")) {
        renderReplies();
      }
    }

    async function waitForFirebaseReady(maxMs = 6000) {
      if (db && firebaseApi) return true;
      if (!hasFirebase) return false;
      const deadline = Date.now() + maxMs;
      while (Date.now() < deadline) {
        await delay(120);
        if (db && firebaseApi) return true;
      }
      return Boolean(db && firebaseApi);
    }

    async function startRepliesListener(note) {
      if (!note?.id) return;

      const noteId = note.id;

      if (repliesListenerNoteId === noteId && repliesUnsubscribe) {
        if (repliesCache.has(noteId)) {
          applyRepliesForNote(noteId, repliesCache.get(noteId));
        }
        return;
      }

      stopRepliesListener();
      repliesListenerNoteId = noteId;
      const token = repliesListenerToken;

      if (repliesCache.has(noteId)) {
        applyRepliesForNote(noteId, repliesCache.get(noteId));
      }

      if (!hasFirebase || noteId.startsWith("seed-")) {
        const local = JSON.parse(localStorage.getItem(`jzt_replies_${noteId}`) || "[]");
        applyRepliesForNote(noteId, local);
        return;
      }

      if (!db || !firebaseApi) {
        const ready = await waitForFirebaseReady();
        if (!ready || token !== repliesListenerToken) {
          console.warn("[回覆] Firebase 尚未就緒");
          applyRepliesForNote(noteId, []);
          return;
        }
      }

      // 先用 getDocs 立即拉資料（LINE WebView 的 onSnapshot 常收不到第一筆）
      try {
        await ensureAuth();
        if (token !== repliesListenerToken) return;
        const replies = await loadReplies(note, { skipCache: true });
        if (token === repliesListenerToken) {
          applyRepliesForNote(noteId, replies);
        }
      } catch (err) {
        console.warn("[回覆] 載入失敗", err);
        if (token === repliesListenerToken && !repliesCache.has(noteId)) {
          applyRepliesForNote(noteId, []);
        }
      }

      if (token !== repliesListenerToken) return;

      try {
        const { collection, onSnapshot, query, limit } = firebaseApi.firestoreModule;
        const q = query(collection(db, "notes", noteId, "replies"), limit(50));
        repliesUnsubscribe = onSnapshot(
          q,
          (snapshot) => {
            if (token !== repliesListenerToken) return;
            applyRepliesForNote(noteId, snapshot.docs.map(mapReplyDoc));
          },
          (err) => {
            console.warn("[回覆] 即時監聽不可用（已載入的回覆不受影響）", err);
          }
        );
      } catch (err) {
        console.warn("[回覆] 監聽建立失敗", err);
      }
    }

    async function loadReplies(note, options = {}) {
      const { skipCache = false } = options;
      if (!note?.id) return [];

      if (!skipCache && repliesCache.has(note.id)) {
        return repliesCache.get(note.id);
      }

      if (!hasFirebase || note.id.startsWith("seed-")) {
        const key = `jzt_replies_${note.id}`;
        const local = JSON.parse(localStorage.getItem(key) || "[]");
        const sorted = sortReplies(local);
        repliesCache.set(note.id, sorted);
        return sorted;
      }

      if (!db || !firebaseApi) return repliesCache.get(note.id) || [];

      try {
        await ensureAuth();
        const replies = await withTimeout((async () => {
          const { collection, getDocs, limit, query } = firebaseApi.firestoreModule;
          const snapshot = await getDocs(
            query(collection(db, "notes", note.id, "replies"), limit(50))
          );
          return sortReplies(snapshot.docs.map(mapReplyDoc));
        })(), 8000, "回覆載入逾時");
        repliesCache.set(note.id, replies);
        return replies;
      } catch (err) {
        const denied = String(err?.code || err?.message || "").includes("permission");
        console.warn("[回覆] 讀取失敗", err);
        if (denied) {
          console.warn("[回覆] 請在 Firestore 規則加入 notes/{noteId}/replies 的 allow read");
        }
        return repliesCache.get(note.id) || [];
      }
    }

    async function loadPickCountsByNoteId() {
      if (!hasFirebase) return {};
      try {
        return await withTimeout((async () => {
          const { collection, getDocs } = firebaseApi.firestoreModule;
          const snapshot = await getDocs(collection(db, "note_picks"));
          const counts = {};
          snapshot.forEach((docSnap) => {
            const noteId = docSnap.data().noteId;
            if (noteId) counts[noteId] = (counts[noteId] || 0) + 1;
          });
          return counts;
        })(), 6000, "撿取統計逾時");
      } catch (err) {
        console.warn("[撿取] 統計載入失敗，略過", err);
        return {};
      }
    }

    async function getPickCountForNote(noteId) {
      if (!hasFirebase || noteId.startsWith("seed-")) {
        return notes.find((item) => item.id === noteId)?.pickedCount || 0;
      }
      const { collection, query, where, getDocs } = firebaseApi.firestoreModule;
      const snapshot = await getDocs(
        query(collection(db, "note_picks"), where("noteId", "==", noteId))
      );
      return snapshot.size;
    }

    /** 從 notes 文件讀 pickedCount，並以 note_picks 統計補舊資料 */
    async function syncPickCount(note) {
      if (!note?.id) return 0;
      if (!hasFirebase || note.id.startsWith("seed-")) {
        return note.pickedCount || 0;
      }
      try {
        await ensureAuth();
        const { doc, getDoc } = firebaseApi.firestoreModule;
        const snap = await getDoc(doc(db, "notes", note.id));
        let count = snap.exists() ? (snap.data().pickedCount || 0) : (note.pickedCount || 0);

        if (count === 0) {
          try {
            const fromPicks = await getPickCountForNote(note.id);
            if (fromPicks > count) count = fromPicks;
          } catch (err) {
            console.warn("[撿取] note_picks 統計失敗", err);
          }
        }

        note.pickedCount = count;
        const idx = notes.findIndex((item) => item.id === note.id);
        if (idx >= 0) notes[idx].pickedCount = count;
        if (selectedNote?.id === note.id) selectedNote.pickedCount = count;
        return count;
      } catch (err) {
        console.warn("[撿取] 次數讀取失敗", err);
        return note.pickedCount || 0;
      }
    }

    async function loadFirebaseNotes() {
      if (!hasFirebase) return [];

      return await withTimeout((async () => {
        const { getDocs } = firebaseApi.firestoreModule;
        const snapshot = await getDocs(buildNotesQuery());
        const all = snapshot.docs.map(mapFirestoreDoc).filter(Boolean);
        console.log(`[紙條] 讀到 ${snapshot.docs.length} 筆，地圖可顯示 ${all.length} 張`);
        return sortNotesByActivity(
          all.filter((item) => (item.reportCount || 0) < 3 || isMyNote(item))
        );
      })(), 12000, "紙條載入逾時");
    }

    // === 檢舉紙條：用 array 記錄誰檢舉過，避免重複檢舉 ===
    async function reportNote(note) {
      if (note.id.startsWith("seed-")) {
        showToast("這是示範紙條，無法檢舉");
        return;
      }
      if (!hasFirebase) {
        showToast("Demo 模式無法檢舉");
        return;
      }
      const { doc, updateDoc, arrayUnion, increment } = firebaseApi.firestoreModule;
      await updateDoc(doc(db, "notes", note.id), {
        reportedBy: arrayUnion(currentUserId),
        reportCount: increment(1)
      });
    }

    // 撿取時 increment notes.pickedCount（規則允許更新計數欄位），並以 note_picks 作備援統計
    async function updatePickedCount(note) {
      return recordNotePick(note);
    }

    async function reverseCity(location) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/reverse");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("lat", String(location.lat));
        url.searchParams.set("lon", String(location.lng));
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.address?.city || data.address?.town || data.address?.county || data.address?.state || "附近";
      } catch {
        return "附近";
      }
    }

    async function searchCity(keyword) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/search");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("q", keyword);
        url.searchParams.set("limit", "5");
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.map((item) => ({
          city: item.display_name.split(",")[0],
          center: { lat: Number(item.lat), lng: Number(item.lon) }
        }));
      } catch {
        return [];
      }
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    /*
      ============= 匿名綽號系統 =============
      可自己換暱稱；每張紙條會記下丟出當下的名字
    */
    const NICKNAME_ADJECTIVES = [
      "沉默的", "漂泊的", "夜行的", "輕盈的", "悠遊的", "勇敢的",
      "溫柔的", "認真的", "清晨的", "黃昏的", "雨後的", "迷路的",
      "好奇的", "做夢的", "微笑的", "靜謐的", "閃爍的", "獨自的",
      "遠方的", "聆聽的", "守候的", "走神的", "懷舊的", "出走的",
      "唱歌的", "畫畫的", "釣魚的", "散步的", "種花的", "聞香的"
    ];
    const NICKNAME_ANIMALS = [
      "螢火蟲", "水獺", "灰鷺", "鯨魚", "麻雀", "白鴿", "貓頭鷹",
      "刺蝟", "松鼠", "袋鼠", "海豹", "狐狸", "海星", "蝸牛",
      "兔子", "鹿", "羚羊", "山雀", "燕子", "海鷗", "鯨豚",
      "獾", "土撥鼠", "穿山甲", "貉", "石虎", "雲豹", "黑熊",
      "藍鵲", "綠繡眼", "夜鶯", "杜鵑", "信天翁", "企鵝", "海馬"
    ];

    function hashStr(str) {
      let h = 5381;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) + h) + str.charCodeAt(i);
        h = h & 0xffffffff;
      }
      return Math.abs(h);
    }

    function generateRandomNickname() {
      const adj = NICKNAME_ADJECTIVES[Math.floor(Math.random() * NICKNAME_ADJECTIVES.length)];
      const ani = NICKNAME_ANIMALS[Math.floor(Math.random() * NICKNAME_ANIMALS.length)];
      const num = Math.floor(Math.random() * 9000) + 1000;
      return `${adj}${ani} #${num}`;
    }

    function nicknameStorageKey(uid) {
      return `jzt_nickname_${uid || "guest"}`;
    }

    function getStoredNickname(uid) {
      if (!uid) return "";
      try {
        return localStorage.getItem(nicknameStorageKey(uid)) || "";
      } catch {
        return "";
      }
    }

    function setMyNickname(nickname, options = {}) {
      const name = (nickname || "").trim().slice(0, 24);
      if (!name) return;
      try {
        localStorage.setItem(nicknameStorageKey(currentUserId), name);
      } catch {}
      if (!options.skipSync) {
        syncNicknameToFirebase(name).catch((err) => console.warn("[暱稱] 雲端同步失敗", err));
      }
    }

    function getMyNickname() {
      const saved = getStoredNickname(currentUserId);
      if (saved) return saved;
      const generated = generateRandomNickname();
      setMyNickname(generated, { skipSync: true });
      return generated;
    }

    const NICKNAME_TONES = ["olive", "tomato", "mustard", "sky", "rose", "ink"];

    function nicknameToneStorageKey(uid) {
      return `jzt_nickname_tone_${uid || "guest"}`;
    }

    function getStoredNicknameTone(uid) {
      try {
        const tone = localStorage.getItem(nicknameToneStorageKey(uid));
        return NICKNAME_TONES.includes(tone) ? tone : "olive";
      } catch {
        return "olive";
      }
    }

    function setMyNicknameTone(tone, options = {}) {
      const next = NICKNAME_TONES.includes(tone) ? tone : "olive";
      try {
        localStorage.setItem(nicknameToneStorageKey(currentUserId), next);
      } catch {}
      applyNicknameTone(next);
      if (!options.skipSync && hasFirebase) {
        syncNicknameStyleToFirebase(next).catch((err) => console.warn("[暱稱] 顏色同步失敗", err));
      }
    }

    function applyNicknameTone(tone) {
      if (!els.myNickname) return;
      NICKNAME_TONES.forEach((item) => els.myNickname.classList.remove(`tone-${item}`));
      els.myNickname.classList.add(`tone-${tone}`);
    }

    function rollNicknameTone() {
      const current = getStoredNicknameTone(currentUserId);
      let next = current;
      while (NICKNAME_TONES.length > 1 && next === current) {
        next = NICKNAME_TONES[Math.floor(Math.random() * NICKNAME_TONES.length)];
      }
      setMyNicknameTone(next);
      return next;
    }

    async function syncNicknameStyleToFirebase(tone) {
      if (!hasFirebase) return;
      await ensureAuth();
      const { doc, setDoc } = firebaseApi.firestoreModule;
      await setDoc(doc(db, "users", currentUserId), { nicknameTone: tone }, { merge: true });
    }

    function placeCaretAtEnd(element) {
      const range = document.createRange();
      range.selectNodeContents(element);
      range.collapse(false);
      const selection = window.getSelection();
      selection?.removeAllRanges();
      selection?.addRange(range);
    }

    function readEditableNickname() {
      return (els.myNicknameText?.textContent || "").replace(/\s+/g, " ").trim().slice(0, 24);
    }

    function setNicknameEditMode(editing) {
      nicknameEditing = editing;
      if (els.myNickname) els.myNickname.classList.toggle("editing", editing);
      if (els.myNicknameText) els.myNicknameText.contentEditable = editing ? "true" : "false";
      if (els.rollNicknameButton) els.rollNicknameButton.hidden = editing;
      if (els.editNicknameButton) els.editNicknameButton.hidden = editing;
      if (els.confirmNicknameButton) els.confirmNicknameButton.hidden = !editing;
      if (els.cancelNicknameButton) els.cancelNicknameButton.hidden = !editing;
    }

    function enterNicknameEdit() {
      nicknameDraftBeforeEdit = getMyNickname();
      if (els.myNicknameText) {
        els.myNicknameText.textContent = nicknameDraftBeforeEdit;
      }
      setNicknameEditMode(true);
      requestAnimationFrame(() => {
        els.myNicknameText?.focus();
        placeCaretAtEnd(els.myNicknameText);
      });
    }

    function exitNicknameEdit() {
      nicknameDraftBeforeEdit = "";
      setNicknameEditMode(false);
      updateMyNicknameUI();
    }

    function updateMyNicknameUI() {
      const name = getMyNickname();
      if (els.myNicknameText && document.activeElement !== els.myNicknameText) {
        els.myNicknameText.textContent = name;
      }
      applyNicknameTone(getStoredNicknameTone(currentUserId));
    }

    function applyNicknameChange(nickname, toastMessage) {
      setMyNickname(nickname);
      updateMyNicknameUI();
      if (selectedNote && isMyNote(selectedNote)) {
        els.pickedAuthor.textContent = `來自我（${getMyNickname()}）`;
      }
      renderNotes();
      showToast(toastMessage);
    }

    function confirmNicknameEdit() {
      const raw = readEditableNickname();
      if (!raw) {
        showToast("請輸入暱稱");
        els.myNicknameText?.focus();
        return;
      }
      applyNicknameChange(raw, "已設定自訂暱稱");
      exitNicknameEdit();
    }

    function cancelNicknameEdit() {
      if (els.myNicknameText) {
        els.myNicknameText.textContent = nicknameDraftBeforeEdit || getMyNickname();
      }
      exitNicknameEdit();
    }

    async function rollMyNickname() {
      if (nicknameEditing) exitNicknameEdit();
      rollNicknameTone();
      applyNicknameChange(generateRandomNickname(), "已隨機換新暱稱與顏色");
    }

    async function syncNicknameToFirebase(nickname) {
      if (!hasFirebase || !nickname) return;
      await ensureAuth();
      const { doc, setDoc } = firebaseApi.firestoreModule;
      await setDoc(doc(db, "users", currentUserId), { nickname }, { merge: true });
    }

    async function loadMyNicknameFromFirebase() {
      if (!hasFirebase) return;
      try {
        await ensureAuth();
        const { doc, getDoc } = firebaseApi.firestoreModule;
        const snap = await getDoc(doc(db, "users", currentUserId));
        if (snap.exists()) {
          const data = snap.data();
          if (data.nickname) {
            setMyNickname(data.nickname, { skipSync: true });
          }
          if (NICKNAME_TONES.includes(data.nicknameTone)) {
            setMyNicknameTone(data.nicknameTone, { skipSync: true });
          }
        }
      } catch (err) {
        console.warn("[暱稱] 雲端讀取失敗", err);
      }
    }

    function legacyNicknameOf(uid) {
      const h = hashStr(uid);
      const adj = NICKNAME_ADJECTIVES[h % NICKNAME_ADJECTIVES.length];
      const ani = NICKNAME_ANIMALS[Math.floor(h / NICKNAME_ADJECTIVES.length) % NICKNAME_ANIMALS.length];
      const num = (h % 9000) + 1000;
      return `${adj}${ani} #${num}`;
    }

    function nicknameOf(uid, note = null) {
      if (!uid) return "路過的旅人";
      if (uid === "seed") return "投條問路使者";
      if (note?.authorNickname) return note.authorNickname;
      if (getMyAuthorUids().has(uid)) return getMyNickname();
      return legacyNicknameOf(uid);
    }

    async function recordNotePick(note) {
      if (hasPickedNoteBefore(note.id)) {
        await syncPickCount(note);
        return false;
      }

      if (hasFirebase && !note.id.startsWith("seed-")) {
        const { doc, setDoc, updateDoc, increment, serverTimestamp } = firebaseApi.firestoreModule;
        await setDoc(doc(db, "note_picks", `${note.id}_${currentUserId}`), {
          noteId: note.id,
          pickerUid: currentUserId,
          authorUid: note.authorUid,
          pickedAt: serverTimestamp()
        });
        try {
          await updateDoc(doc(db, "notes", note.id), {
            pickedCount: increment(1)
          });
          note.pickedCount = (note.pickedCount || 0) + 1;
        } catch (err) {
          console.warn("[撿取] notes.pickedCount 更新失敗", err);
          note.pickedCount = await getPickCountForNote(note.id);
        }
        saveNotesCache();
      } else {
        note.pickedCount = (note.pickedCount || 0) + 1;
        saveDemoNotes();
      }

      pickedNoteIds.add(note.id);
      savePickedNotesLocal();
      updateNearbyAlert();
      await syncPickedNoteMark(note.id);
      return true;
    }

    /*
      ============= 撿紙條計次 =============
      同一張紙條，同一人只算一次；次數存在 note_picks 集合（誰都能新增自己的撿取紀錄）
    */
    function pickedNotesStorageKey() {
      return `jzt_picked_notes_${currentUserId}`;
    }

    function savePickedNotesLocal() {
      localStorage.setItem(
        pickedNotesStorageKey(),
        JSON.stringify([...pickedNoteIds])
      );
    }

    function loadPickedNotesLocal() {
      pickedNoteIds = new Set();
      try {
        JSON.parse(localStorage.getItem(pickedNotesStorageKey()) || "[]")
          .forEach((noteId) => pickedNoteIds.add(noteId));
      } catch {}
    }

    async function syncPickedNotesFromFirebase() {
      if (!hasFirebase) return;

      try {
        const { collection, doc, getDoc, getDocs, query, where } = firebaseApi.firestoreModule;
        const snap = await getDocs(
          query(collection(db, "note_picks"), where("pickerUid", "==", currentUserId))
        );
        snap.forEach((docSnap) => {
          const noteId = docSnap.data().noteId;
          if (noteId) pickedNoteIds.add(noteId);
        });

        const userSnap = await getDoc(doc(db, "users", currentUserId));
        if (userSnap.exists()) {
          (userSnap.data().pickedNoteIds || []).forEach((noteId) => pickedNoteIds.add(noteId));
        }
        savePickedNotesLocal();
      } catch (err) {
        console.warn("[撿記錄] Firebase 讀取失敗，使用本機", err);
      }
    }

    async function loadPickedAuthors() {
      loadPickedNotesLocal();
      await syncPickedNotesFromFirebase();
    }

    function hasPickedNoteBefore(noteId) {
      return pickedNoteIds.has(noteId);
    }

    async function syncPickedNoteMark(noteId) {
      if (!hasFirebase) return;

      try {
        const { doc, setDoc, arrayUnion } = firebaseApi.firestoreModule;
        await setDoc(
          doc(db, "users", currentUserId),
          { pickedNoteIds: arrayUnion(noteId) },
          { merge: true }
        );
      } catch (err) {
        console.warn("[撿記錄] 使用者紀錄寫入失敗", err);
      }
    }

    /*
      ============= 追蹤系統 =============
      存「我追蹤的 UID」清單到 localStorage
      純前端設計：每個人的追蹤名單只在自己瀏覽器、不上 Firebase
      優點：不動 Firestore 規則、零後端成本、不影響別人隱私
      缺點：換裝置會遺失（如果用 LIFF 登入 LINE，跨裝置 UID 一樣但追蹤名單不同步）
    */
    function getFollowedUids() {
      try {
        return new Set(JSON.parse(localStorage.getItem("jzt_following") || "[]"));
      } catch {
        return new Set();
      }
    }

    function isFollowing(uid) {
      return getFollowedUids().has(uid);
    }

    function toggleFollow(uid) {
      const set = getFollowedUids();
      if (set.has(uid)) {
        set.delete(uid);
        localStorage.setItem("jzt_following", JSON.stringify([...set]));
        return false;  // 已取消追蹤
      } else {
        set.add(uid);
        localStorage.setItem("jzt_following", JSON.stringify([...set]));
        return true;   // 已追蹤
      }
    }

    function updateFollowButtonUI(uid) {
      const following = isFollowing(uid);
      els.followButton.textContent = following ? "✓ 追蹤中" : "+ 追蹤";
      els.followButton.classList.toggle("following", following);
    }

    function distanceMeters(a, b) {
      const earthRadius = 6371000;
      const toRad = (value) => value * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * earthRadius * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    /*
      自製對話框：取代原生 alert/confirm，配合法式繪本風格
      用法：
        const ok = await customConfirm("要刪除嗎？");
        if (ok) ...
        await customAlert("已刪除");
    */
    const dialogBackdrop = document.querySelector("#dialogBackdrop");
    const dialogMessage = document.querySelector("#dialogMessage");
    const dialogConfirm = document.querySelector("#dialogConfirm");
    const dialogCancel = document.querySelector("#dialogCancel");

    function customConfirm(message, { confirmText = "確定", cancelText = "取消", danger = false } = {}) {
      return new Promise((resolve) => {
        dialogMessage.textContent = message;
        dialogConfirm.textContent = confirmText;
        dialogCancel.textContent = cancelText;
        dialogCancel.style.display = "";
        // 標示危險動作（紅色按鈕）
        dialogConfirm.classList.toggle("danger-button", danger);
        dialogConfirm.classList.toggle("primary-button", !danger);

        dialogBackdrop.classList.add("show");

        const onConfirm = () => { cleanup(); resolve(true); };
        const onCancel = () => { cleanup(); resolve(false); };
        const onBackdrop = (e) => { if (e.target === dialogBackdrop) onCancel(); };

        function cleanup() {
          dialogBackdrop.classList.remove("show");
          dialogConfirm.removeEventListener("click", onConfirm);
          dialogCancel.removeEventListener("click", onCancel);
          dialogBackdrop.removeEventListener("click", onBackdrop);
        }

        dialogConfirm.addEventListener("click", onConfirm);
        dialogCancel.addEventListener("click", onCancel);
        dialogBackdrop.addEventListener("click", onBackdrop);
      });
    }

    function customAlert(message, { confirmText = "好" } = {}) {
      return new Promise((resolve) => {
        dialogMessage.textContent = message;
        dialogConfirm.textContent = confirmText;
        dialogCancel.style.display = "none";
        dialogConfirm.classList.add("primary-button");
        dialogConfirm.classList.remove("danger-button");

        dialogBackdrop.classList.add("show");

        const onConfirm = () => {
          dialogBackdrop.classList.remove("show");
          dialogCancel.style.display = "";  // 恢復
          dialogConfirm.removeEventListener("click", onConfirm);
          resolve();
        };
        dialogConfirm.addEventListener("click", onConfirm);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
