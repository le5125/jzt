<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbeed4" />
  <title>丟紙條</title>

  <!-- 法式繪本字體：Caveat（手寫流暢）+ Patrick Hand（手寫工整）+ 思源中文 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Patrick+Hand&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQFu7uzU8yvepu9ZjY3OWnQafElyD4="
    crossorigin=""
  />

  <style>
    /* ================================================================
       設計哲學：法式繪本（Storybook illustration）
       靈感：Sempé、Tomi Ungerer、Jean Jullien、《小王子》
       特徵：粗墨線、手繪不對稱、暖色塊、紙巾紋理、手寫字
       ================================================================ */

    :root {
      /* 主色票：莫蘭迪 × 馬諦斯 */
      --paper:        #fbeed4;   /* 主背景：奶黃信紙 */
      --paper-light:  #fff8e3;   /* 卡片底：更亮的奶油 */
      --paper-warm:   #f0d9aa;   /* 暖色塊 */
      --ink:          #1f1812;   /* 主墨色（不是純黑，更柔和） */
      --ink-soft:     #5a4536;
      --muted:        #9a8870;

      /* 強調色 */
      --tomato:       #d94f3d;   /* 番茄紅（主強調色，按鈕、自己） */
      --tomato-deep:  #a8311f;
      --mustard:      #e6a724;   /* 芥末黃（標題、別人紙條） */
      --olive:        #6b8e4e;   /* 橄欖綠（次要） */
      --sky:          #6ba8c4;   /* 天空藍（裝飾） */
      --rose:         #e8a09c;   /* 玫瑰粉（柔和強調） */

      --shadow-sm: 2px 3px 0 var(--ink);
      --shadow-md: 3px 4px 0 var(--ink);
      --shadow-lg: 4px 6px 0 var(--ink);

      font-family: "Patrick Hand", "Caveat", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--paper);
      /* 法式繪本紙巾紋理：兩層斑點 + 一層淡漸層 */
      background-image:
        /* 紙張顆粒 */
        radial-gradient(circle at 20% 30%, rgba(217, 79, 61, 0.05) 0%, transparent 4%),
        radial-gradient(circle at 80% 70%, rgba(107, 142, 78, 0.04) 0%, transparent 5%),
        radial-gradient(circle at 50% 20%, rgba(230, 167, 36, 0.04) 0%, transparent 4%),
        /* 紙張纖維 */
        repeating-linear-gradient(
          37deg,
          transparent 0 3px,
          rgba(31, 24, 18, 0.012) 3px 4px
        ),
        repeating-linear-gradient(
          120deg,
          transparent 0 5px,
          rgba(31, 24, 18, 0.01) 5px 6px
        );
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ========== 開場動畫 ========== */
    /* 進入時蓋一張全螢幕「信鴿叼紙條飛過」動畫
       1.2 秒後自動淡出消失，使用者看不到資料載入的閃爍
       使用者也可以點任何地方提早關閉 */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--paper);
      background-image:
        radial-gradient(circle at 30% 30%, rgba(230, 167, 36, 0.15), transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(217, 79, 61, 0.1), transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      animation: splashFade 0.4s ease-in 1.2s forwards;
    }
    /* 使用者點擊也能立刻消失 */
    .splash.dismissed {
      animation: splashFade 0.3s ease-in forwards;
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    .splash-scene {
      position: relative;
      width: 260px;
      height: 120px;
    }

    .splash-bird {
      position: absolute;
      width: 80px;
      height: 80px;
      top: 20px;
      left: -90px;
      animation: birdFly 1.2s cubic-bezier(0.3, 0, 0.5, 1) forwards;
    }
    @keyframes birdFly {
      0%   { transform: translateX(0) translateY(0) rotate(-3deg); }
      30%  { transform: translateX(80px) translateY(-8px) rotate(2deg); }
      60%  { transform: translateX(200px) translateY(-4px) rotate(-1deg); }
      100% { transform: translateX(360px) translateY(0) rotate(3deg); }
    }

    .splash-wing {
      transform-origin: 35px 30px;
      animation: wingFlap 0.25s ease-in-out infinite alternate;
    }
    @keyframes wingFlap {
      from { transform: rotate(-15deg); }
      to   { transform: rotate(35deg); }
    }

    .splash-title {
      font-family: "Caveat", cursive;
      font-size: 56px;
      font-weight: 700;
      color: var(--ink);
      text-shadow: 3px 3px 0 var(--mustard);
      letter-spacing: 0.05em;
      transform: rotate(-2deg);
      margin: 0;
      animation: splashTitle 0.5s ease-out 0.2s both;
    }
    @keyframes splashTitle {
      from { opacity: 0; transform: rotate(-2deg) translateY(20px); }
      to   { opacity: 1; transform: rotate(-2deg) translateY(0); }
    }

    .splash-subtitle {
      font-size: 15px;
      color: var(--ink-soft);
      letter-spacing: 0.2em;
      margin: 0;
      animation: splashTitle 0.5s ease-out 0.4s both;
    }

    .splash-skip {
      position: absolute;
      bottom: 32px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.15em;
      animation: splashTitle 0.5s ease-out 0.6s both;
    }

    /* ========== 地圖 ========== */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      /* 法式繪本暖色濾鏡：略飽和、偏黃 */
      filter: sepia(0.15) saturate(0.85) brightness(1.04) contrast(1.03);
    }

    /* Leaflet 必要樣式 */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow,
    .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas,
    .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer {
      position: absolute; left: 0; top: 0;
    }
    .leaflet-container {
      overflow: hidden;
      touch-action: pan-x pan-y;
      background: #e8dcc0;
      font-family: inherit;
    }
    .leaflet-tile { visibility: hidden; border: 0; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-animated { transform-origin: 0 0; }
    .leaflet-interactive { cursor: pointer; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: auto; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-control-zoom, .leaflet-control-attribution { display: none; }

    /* ========== 頂部「投條位置」欄 ========== */
    .top-bar {
      position: absolute;
      z-index: 500;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .city-button {
      pointer-events: auto;
      max-width: min(440px, 100%);
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      /* 法式繪本：粗墨線、不對稱圓角 */
      border: 2.5px solid var(--ink);
      border-radius: 24px 30px 26px 28px;
      background: var(--paper-light);
      box-shadow: var(--shadow-md);
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      transform: rotate(-0.5deg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .city-button:active {
      transform: rotate(-0.5deg) translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .city-button::before {
      content: "📍";
      font-size: 18px;
      flex-shrink: 0;
    }

    .city-button #cityText {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-button #locateText {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--mustard);
      border: 2px solid var(--ink);
      transform: rotate(2deg);
    }

    /* ========== 篩選器 ========== */
    .filter-bar {
      position: absolute;
      z-index: 500;
      top: calc(max(16px, env(safe-area-inset-top)) + 64px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
      pointer-events: none;
    }
    .filter-pill {
      pointer-events: auto;
      padding: 6px 14px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--paper-light);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }
    .filter-pill:nth-child(1) { transform: rotate(-1deg); }
    .filter-pill:nth-child(2) { transform: rotate(1deg); }
    .filter-pill:nth-child(3) { transform: rotate(-1deg); }
    .filter-pill.active {
      background: var(--tomato);
      color: var(--paper);
    }
    .filter-pill:active {
      transform: translate(2px, 2px) rotate(0) !important;
      box-shadow: 0 0 0 var(--ink);
    }

    /* ========== 右側懸浮控制鈕 ========== */
    .side-controls {
      position: absolute;
      z-index: 500;
      right: 16px;
      bottom: calc(150px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side-button {
      width: 52px;
      height: 52px;
      /* 不對稱圓角 - 像手繪的圓 */
      border-radius: 50% 48% 52% 50%;
      background: var(--paper-light);
      border: 2.5px solid var(--ink);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .side-button:nth-child(1) { transform: rotate(-3deg); }
    .side-button:nth-child(2) { transform: rotate(2deg); }
    .side-button:nth-child(3) { transform: rotate(-1deg); }

    .side-button:active {
      transform: rotate(0deg) translate(2px, 3px) !important;
      box-shadow: 1px 1px 0 var(--ink);
    }

    .side-button svg {
      width: 24px;
      height: 24px;
      stroke: var(--ink);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .side-button.locating {
      background: var(--tomato);
    }
    .side-button.locating svg { stroke: var(--paper); }

    /* ========== 底部三欄 ========== */
    .bottom-bar {
      position: absolute;
      z-index: 500;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 0 calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      pointer-events: none;
      background: linear-gradient(to top, rgba(251, 238, 212, 0.96) 30%, rgba(251, 238, 212, 0) 100%);
    }

    .bottom-tab {
      pointer-events: auto;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      justify-self: center;
      min-width: 70px;
    }

    .bottom-tab svg {
      width: 28px;
      height: 28px;
      stroke: var(--ink);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom-tab.left { justify-self: start; padding-left: 28px; }
    .bottom-tab.right { justify-self: end; padding-right: 28px; }
    .bottom-tab.active { color: var(--tomato); }
    .bottom-tab:active { transform: translateY(2px); }

    /* ★ 中央大紙團「扔」按鈕 ★ */
    .throw-paper-ball {
      pointer-events: auto;
      width: 130px;
      height: 130px;
      position: relative;
      transform: translateY(-18px);
      cursor: pointer;
      animation: paperFloat 4s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .throw-paper-ball img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      /* 法式繪本硬陰影：用 drop-shadow 模擬 */
      filter: drop-shadow(2px 4px 0 rgba(31, 24, 18, 0.18));
    }

    .throw-paper-ball:active {
      transform: translateY(-14px) scale(0.92);
      animation: none;
    }

    @keyframes paperFloat {
      0%, 100% { transform: translateY(-18px) rotate(-3deg); }
      50%      { transform: translateY(-24px) rotate(3deg); }
    }

    /* ========== Marker（地圖上的紙條圖示） ========== */
    /* 別人的紙條：芥末黃 + 粗墨線 */
    .paper-marker {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      background: var(--mustard);
      border: 2.5px solid var(--ink);
      /* 手繪不對稱圓角 */
      border-radius: 8px 12px 7px 10px;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(-6deg);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .paper-marker:hover { transform: rotate(-6deg) scale(1.15); }

    /* 自己的紙條：番茄紅 */
    .paper-marker.mine {
      background: var(--tomato);
      color: var(--paper);
    }

    /* 追蹤中的人的紙條：天空藍 */
    .paper-marker.followed {
      background: var(--sky);
      color: var(--paper);
    }
    .paper-marker.followed::before {
      background: var(--olive);
    }

    /* 圖片紙條 */
    .paper-marker.image-marker {
      width: 46px;
      height: 46px;
      padding: 3px;
      background: var(--paper-light);
      border-radius: 6px 10px 7px 9px;
      transform: rotate(-4deg);
    }
    .paper-marker.image-marker.mine {
      background: var(--tomato);
    }
    .paper-marker.image-marker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      pointer-events: none;
      user-select: none;
    }

    /* 右上角小圓點（像郵戳） */
    .paper-marker::before {
      content: "";
      position: absolute;
      top: -5px;
      right: -5px;
      width: 12px;
      height: 12px;
      background: var(--tomato);
      border: 2px solid var(--ink);
      border-radius: 50%;
    }
    .paper-marker.mine::before {
      background: var(--olive);
    }

    /* 使用者位置標記（藍點） */
    .user-marker {
      width: 22px;
      height: 22px;
      background: var(--sky);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(107, 168, 196, 0.25), 2px 3px 0 var(--ink);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(107, 168, 196, 0.25), 2px 3px 0 var(--ink); }
      50%      { box-shadow: 0 0 0 12px rgba(107, 168, 196, 0.1), 2px 3px 0 var(--ink); }
    }

    /* ========== 底部抽屜 ========== */
    .sheet {
      position: absolute;
      z-index: 800;
      left: 8px;
      right: 8px;
      bottom: 0;
      max-height: min(80vh, 620px);
      padding: 22px 22px calc(28px + env(safe-area-inset-bottom));
      /* 不對稱圓角 + 粗墨線 */
      border-radius: 24px 28px 0 0;
      background: var(--paper-light);
      border: 2.5px solid var(--ink);
      border-bottom: 0;
      box-shadow: 0 -4px 0 var(--ink);
      overflow: auto;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open { transform: translateY(0); }

    /* 高版抽屜：用於「我的紙條」這種內容多的，撐到接近全螢幕 */
    .sheet-tall {
      max-height: calc(100vh - 40px);
      min-height: 70vh;
    }

    /* 拖拉中的抽屜暫時關閉動畫，直接跟手指 */
    .sheet.dragging {
      transition: none;
    }

    /* 抽屜頂部小握把 */
    .sheet::before {
      content: "";
      display: block;
      width: 48px;
      height: 5px;
      border-radius: 3px;
      background: var(--ink);
      margin: -10px auto 16px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .sheet-header h2 {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 32px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
      transform: rotate(-1deg);
      position: relative;
    }
    /* 標題下面的手繪曲線 */
    .sheet-header h2::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -6px;
      height: 6px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M2,3 Q25,0 50,3 T98,3' stroke='%23d94f3d' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--ink);
      border-radius: 50% 48% 52% 50%;
      background: var(--paper);
      color: var(--ink);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(3deg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .close-button:active {
      transform: rotate(3deg) translate(2px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    /* ========== 表單元素 ========== */
    textarea, input[type="text"], input:not([type]), input[type="search"] {
      width: 100%;
      border: 2.5px solid var(--ink);
      border-radius: 12px 14px 11px 13px;
      padding: 14px;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      font-size: 16px;
      line-height: 1.7;
      font-family: "Patrick Hand", "Caveat", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      resize: vertical;
      box-shadow: var(--shadow-sm);
      /* 信紙橫線 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 30px,
        rgba(31, 24, 18, 0.12) 30px,
        rgba(31, 24, 18, 0.12) 31px
      );
      background-position: 0 14px;
      transition: box-shadow 0.15s ease, transform 0.1s ease;
    }
    input[type="text"], input:not([type]), input[type="search"] {
      background-image: none;
      padding: 12px 14px;
    }
    textarea:focus, input:focus {
      box-shadow: 3px 5px 0 var(--tomato);
    }

    input[type="file"] {
      width: 100%;
      border: 2.5px dashed var(--ink);
      border-radius: 12px;
      padding: 10px 14px;
      background: var(--paper);
      font-family: inherit;
      color: var(--ink-soft);
    }

    .throw-form, .picked-note, .reply-form {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .city-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
    }

    /* ========== 按鈕（法式繪本三色：番茄、芥末、奶油） ========== */
    .primary-button, .secondary-button, .danger-button {
      min-height: 48px;
      border: 2.5px solid var(--ink);
      border-radius: 12px 16px 13px 14px;
      padding: 0 22px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
      box-shadow: var(--shadow-md);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .primary-button {
      background: var(--tomato);
      color: var(--paper);
    }
    .primary-button:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .primary-button:disabled {
      background: var(--paper-warm);
      color: var(--muted);
      cursor: not-allowed;
    }
    .primary-button:disabled:active {
      transform: none;
      box-shadow: var(--shadow-md);
    }

    .secondary-button {
      background: var(--mustard);
      color: var(--ink);
    }
    .secondary-button:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .danger-button {
      background: var(--ink);
      color: var(--paper);
      min-height: 42px;
      padding: 0 18px;
      box-shadow: 2px 3px 0 var(--tomato);
    }
    .danger-button:active {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 var(--tomato);
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ========== 撿到紙條 - 主體 ========== */
    /* 作者列：綽號 + 追蹤按鈕 */
    .picked-author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    /* 紙條來自誰 - 匿名綽號 */
    .picked-author {
      margin: 0 0 4px 4px;
      font-family: "Caveat", cursive;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      transform: rotate(-1deg);
      display: inline-block;
      padding: 4px 14px;
      background: var(--mustard);
      border: 2.5px solid var(--ink);
      border-radius: 14px 16px 13px 15px;
      box-shadow: 2px 3px 0 var(--ink);
    }
    .picked-author.mine {
      background: var(--olive);
      color: var(--paper-light);
    }

    /* 追蹤按鈕 */
    .follow-button {
      border: 2.5px solid var(--ink);
      border-radius: 14px 18px 13px 17px;
      padding: 6px 14px;
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      box-shadow: 2px 2px 0 var(--ink);
      transform: rotate(1deg);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }
    .follow-button:active {
      transform: rotate(1deg) translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .follow-button.following {
      background: var(--olive);
      color: var(--paper-light);
    }

    /* 我的紙條頁：顯示自己的綽號 */
    .my-nickname {
      margin: 18px 0 0 4px;
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink);
      font-weight: 700;
      display: inline-block;
      padding: 6px 16px;
      background: var(--olive);
      color: var(--paper-light);
      border: 2.5px solid var(--ink);
      border-radius: 14px 18px 13px 16px;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(-1deg);
    }

    .note-content {
      margin: 0;
      padding: 24px;
      border: 2.5px solid var(--ink);
      border-radius: 4px 12px 6px 10px;
      background: var(--paper-light);
      line-height: 2.0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 18px;
      color: var(--ink);
      font-family: "Caveat", "Patrick Hand", "Noto Sans TC", serif;
      box-shadow: var(--shadow-md);
      position: relative;
      /* 信紙橫線 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 30px,
        rgba(31, 24, 18, 0.1) 30px,
        rgba(31, 24, 18, 0.1) 31px
      );
      background-position: 0 18px;
      transform: rotate(-0.5deg);
    }
    /* 右下角小郵戳 */
    .note-content::after {
      content: "";
      position: absolute;
      bottom: 10px;
      right: 12px;
      width: 38px;
      height: 38px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='15' fill='none' stroke='%23d94f3d' stroke-width='2' stroke-dasharray='3 2'/><text x='20' y='25' font-size='14' font-family='serif' font-weight='bold' fill='%23d94f3d' text-anchor='middle'>私</text></svg>") no-repeat center / contain;
      transform: rotate(-12deg);
    }

    .note-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0;
      padding: 14px 6px;
      border-top: 2.5px dashed var(--ink);
      border-bottom: 2.5px dashed var(--ink);
    }
    .note-meta dt {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.15em;
      font-weight: 700;
    }
    .note-meta dd {
      margin: 6px 0 0;
      color: var(--ink);
      font-weight: 700;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .reply-panel {
      display: grid;
      gap: 14px;
    }
    .reply-panel h3 {
      margin: 4px 0 0;
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink);
      letter-spacing: 0.05em;
      transform: rotate(-1deg);
    }

    .reply-list {
      display: grid;
      gap: 10px;
      max-height: 200px;
      overflow: auto;
    }

    .reply-card {
      display: grid;
      gap: 6px;
      padding: 14px;
      border: 2.5px solid var(--ink);
      border-radius: 10px 14px 11px 12px;
      background: var(--paper);
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(-0.3deg);
    }
    .reply-card:nth-child(2n) { transform: rotate(0.4deg); }
    .reply-card p {
      margin: 0;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .reply-card small {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .sticker-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .sticker-button {
      aspect-ratio: 1;
      border: 2.5px solid var(--ink);
      border-radius: 50% 48% 52% 50%;
      background: var(--paper);
      font-size: 26px;
      box-shadow: 2px 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .sticker-button:nth-child(odd) { transform: rotate(-3deg); }
    .sticker-button:nth-child(even) { transform: rotate(3deg); }
    .sticker-button:active {
      transform: translate(2px, 3px) rotate(0) !important;
      box-shadow: 0 0 0 var(--ink);
    }

    /* 撿紙條底部動作列 */
    .pick-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 2.5px dashed var(--ink);
    }
    .text-button {
      padding: 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.05em;
      text-decoration: underline;
      text-decoration-color: var(--muted);
      text-decoration-style: wavy;
      text-underline-offset: 4px;
      align-self: center;
    }
    .text-button:active { color: var(--tomato); }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    /* ========== 圖片預覽 ========== */
    .image-input-row {
      display: grid;
      gap: 10px;
    }
    .image-preview, .picked-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border: 2.5px solid var(--ink);
      border-radius: 6px 12px 7px 11px;
      background: var(--paper);
      box-shadow: var(--shadow-md);
      transform: rotate(-1deg);
    }

    /* ========== 城市搜尋結果 ========== */
    .result-row {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      border: 2.5px solid var(--ink);
      border-radius: 10px 14px 11px 12px;
      background: var(--paper);
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      box-shadow: 2px 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .result-row:active {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    /* ========== 我的紙條頁 ========== */
    .page {
      position: absolute;
      z-index: 900;
      inset: 0;
      display: none;
      padding: 20px;
      background: var(--paper);
      overflow: auto;
    }
    .page.open { display: block; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: env(safe-area-inset-top);
    }
    .page-header h1 {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 38px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
      transform: rotate(-1deg);
      position: relative;
    }
    .page-header h1::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -8px;
      height: 8px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 8' preserveAspectRatio='none'><path d='M2,4 Q25,0 50,4 T98,4' stroke='%23e6a724' stroke-width='3' fill='none' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
    }

    .note-list {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .note-card {
      padding: 18px;
      border: 2.5px solid var(--ink);
      border-radius: 8px 14px 9px 12px;
      background: var(--paper-light);
      box-shadow: var(--shadow-md);
      transform: rotate(-0.5deg);
    }
    .note-card:nth-child(2n) { transform: rotate(0.6deg); }
    .note-card:nth-child(3n) { transform: rotate(-0.3deg); }
    .note-card p {
      margin: 0 0 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      font-size: 16px;
    }
    .note-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* ========== 附近紙條提示 ========== */
    .alert {
      position: absolute;
      z-index: 500;
      left: 50%;
      bottom: 168px;
      transform: translateX(-50%) rotate(-2deg);
      border: 2.5px solid var(--ink);
      border-radius: 24px 30px 26px 28px;
      padding: 12px 22px;
      color: var(--paper);
      background: var(--tomato);
      box-shadow: var(--shadow-md);
      display: none;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-size: 15px;
      font-family: inherit;
      animation: alertBounce 1.4s ease-in-out infinite;
    }
    .alert.show { display: block; }

    @keyframes alertBounce {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
      50%      { transform: translateX(-50%) translateY(-6px) rotate(-2deg); }
    }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      z-index: 1000;
      left: 50%;
      top: max(80px, calc(env(safe-area-inset-top) + 70px));
      max-width: min(520px, calc(100% - 28px));
      transform: translateX(-50%) rotate(-1deg);
      border: 2.5px solid var(--ink);
      border-radius: 16px 20px 17px 19px;
      padding: 12px 22px;
      color: var(--paper);
      background: var(--ink);
      box-shadow: 3px 4px 0 var(--mustard);
      display: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
    }
    .toast.show {
      display: block;
      animation: toastIn 0.3s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-12px) rotate(-1deg); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) rotate(-1deg); }
    }

    /* ========== 自製對話框（取代 alert/confirm） ========== */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(31, 24, 18, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: dialogFadeIn 0.2s ease-out;
    }
    .dialog-backdrop.show { display: flex; }

    @keyframes dialogFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .dialog-box {
      background: var(--paper-light);
      border: 3px solid var(--ink);
      border-radius: 18px 22px 19px 21px;
      box-shadow: var(--shadow-lg);
      padding: 24px 22px 22px;
      max-width: 360px;
      width: 100%;
      transform: rotate(-1deg);
      animation: dialogPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes dialogPopIn {
      from { opacity: 0; transform: rotate(-1deg) scale(0.85); }
      to   { opacity: 1; transform: rotate(-1deg) scale(1); }
    }

    .dialog-message {
      margin: 0 0 22px;
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      font-weight: 700;
      white-space: pre-wrap;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .dialog-actions .primary-button,
    .dialog-actions .secondary-button {
      min-width: 88px;
      min-height: 42px;
      padding: 0 18px;
      font-size: 15px;
    }

    @media (max-width: 380px) {
      .note-meta { grid-template-columns: 1fr 1fr; }
      .bottom-tab.left { padding-left: 18px; }
      .bottom-tab.right { padding-right: 18px; }
      .throw-paper-ball { width: 104px; height: 104px; }
    }
  </style>
</head>

<body>
  <!-- ============= 開場動畫（1.2 秒後自動淡出；點任意處可提早關） ============= -->
  <div class="splash" id="splash" aria-hidden="true" onclick="this.classList.add('dismissed')">
    <div class="splash-scene" aria-hidden="true">
      <!-- 信鴿叼著紙條飛過 -->
      <svg class="splash-bird" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <!-- 身體 -->
        <ellipse cx="40" cy="42" rx="22" ry="14" fill="#fbeed4" stroke="#1f1812" stroke-width="2.5"/>
        <!-- 頭 -->
        <circle cx="58" cy="32" r="11" fill="#fbeed4" stroke="#1f1812" stroke-width="2.5"/>
        <!-- 嘴 -->
        <path d="M68,32 L76,30 L70,36 Z" fill="#e6a724" stroke="#1f1812" stroke-width="2"/>
        <!-- 眼 -->
        <circle cx="60" cy="29" r="1.6" fill="#1f1812"/>
        <!-- 翅膀（會動的） -->
        <g class="splash-wing">
          <path d="M35,32 Q30,16 18,18 Q14,25 22,38 Q30,42 35,38 Z"
                fill="#e6a724" stroke="#1f1812" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <!-- 腳 -->
        <line x1="38" y1="54" x2="36" y2="62" stroke="#1f1812" stroke-width="2" stroke-linecap="round"/>
        <line x1="44" y1="54" x2="42" y2="62" stroke="#1f1812" stroke-width="2" stroke-linecap="round"/>
        <!-- 嘴上叼的紙條 -->
        <g transform="translate(72,30) rotate(-15)">
          <rect x="0" y="0" width="14" height="10" fill="#fff8e3" stroke="#1f1812" stroke-width="2" rx="1"/>
          <line x1="3" y1="3.5" x2="11" y2="3.5" stroke="#1f1812" stroke-width="1" opacity="0.5"/>
          <line x1="3" y1="6.5" x2="9" y2="6.5" stroke="#1f1812" stroke-width="1" opacity="0.5"/>
        </g>
      </svg>
    </div>
    <h1 class="splash-title">丟紙條</h1>
    <p class="splash-subtitle">在地圖上輕輕放下一句話</p>
    <p class="splash-skip">點任意處跳過</p>
  </div>

  <main id="app">
    <div id="map"></div>

    <!-- 頂部投條位置欄 -->
    <div class="top-bar">
      <button id="cityButton" class="city-button" type="button">
        <span id="cityText">台北</span>
        <strong id="locateText">重新定位</strong>
      </button>
    </div>

    <!-- 篩選器：全部 / 我追蹤 / 我的 -->
    <div class="filter-bar" aria-label="篩選地圖紙條">
      <button class="filter-pill active" data-filter="all" type="button">全部</button>
      <button class="filter-pill" data-filter="following" type="button">我追蹤</button>
      <button class="filter-pill" data-filter="mine" type="button">我的</button>
    </div>

    <!-- 右側懸浮控制鈕（垂直）-->
    <div class="side-controls" aria-label="地圖控制">
      <!-- 定位 -->
      <button id="locateButton" class="side-button" type="button" title="定位到我">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="9" stroke-dasharray="2 3" opacity="0.5"/>
        </svg>
      </button>
      <!-- 重新整理 -->
      <button id="refreshButton" class="side-button" type="button" title="重新整理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 11-3-6.7L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
      <!-- 切換城市 -->
      <button id="cityHopButton" class="side-button" type="button" title="切換城市">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s-7-7.5-7-13a7 7 0 0114 0c0 5.5-7 13-7 13z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </button>
    </div>

    <!-- 底部三欄 -->
    <div class="bottom-bar" aria-label="主要操作">
      <button id="nearbyListButton" class="bottom-tab left" type="button">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="9" stroke-dasharray="2 3" opacity="0.6"/>
        </svg>
        <span>附近</span>
      </button>

      <!-- ★ 中央大紙團「扔」按鈕 ★ -->
      <button id="openThrowButton" class="throw-paper-ball" type="button" title="丟紙條" aria-label="丟紙條">
        <img src="paper_ball.png" alt="扔出去" />
      </button>

      <button id="myNotesButton" class="bottom-tab right" type="button">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M20 6H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2z"/>
          <path d="M2 9l10 5 10-5"/>
        </svg>
        <span>我的</span>
      </button>
    </div>

    <!-- 附近紙條提示 -->
    <button id="nearbyAlert" class="alert" type="button">附近有 0 張紙條，點我撿起</button>
    <div id="toast" class="toast"></div>

    <!-- 丟紙條抽屜 -->
    <section id="throwSheet" class="sheet" aria-label="丟紙條">
      <header class="sheet-header">
        <h2>寫一張紙條</h2>
        <button class="close-button" type="button" data-close>×</button>
      </header>
      <form id="throwForm" class="throw-form">
        <textarea id="noteInput" maxlength="140" rows="5" placeholder="把想留下的話，輕輕寫在這張信紙上⋯"></textarea>
        <div class="image-input-row">
          <input id="imageInput" type="file" accept="image/*" />
          <img id="imagePreview" class="image-preview" alt="圖片預覽" hidden />
          <span class="muted">可只寫文字，也可選一張圖片一起丟出去</span>
        </div>
        <div class="sheet-row">
          <span id="countText" class="muted">140 字</span>
          <button id="submitNoteButton" class="primary-button" type="submit" disabled>扔出去</button>
        </div>
      </form>
    </section>

    <!-- 附近紙條列表抽屜 -->
    <section id="nearbySheet" class="sheet" aria-label="附近紙條">
      <header class="sheet-header">
        <h2>附近的紙條</h2>
        <button class="close-button" type="button" data-close>×</button>
      </header>
      <div id="nearbyList" class="note-list"></div>
    </section>

    <!-- 撿到紙條抽屜 -->
    <section id="pickSheet" class="sheet" aria-label="撿到紙條">
      <header class="sheet-header">
        <h2>撿到一張紙條</h2>
        <button class="close-button" type="button" data-close>×</button>
      </header>
      <article class="picked-note">
        <div class="picked-author-row">
          <p id="pickedAuthor" class="picked-author">—</p>
          <button id="followButton" class="follow-button" type="button" hidden>+ 追蹤</button>
        </div>
        <p id="pickedContent" class="note-content"></p>
        <dl class="note-meta">
          <div>
            <dt>城市</dt>
            <dd id="pickedCity">—</dd>
          </div>
          <div>
            <dt>被撿起</dt>
            <dd id="pickedCount">0 次</dd>
          </div>
          <div>
            <dt>留下時間</dt>
            <dd id="pickedTime">—</dd>
          </div>
        </dl>
        <section class="reply-panel" aria-label="回覆">
          <h3>續寫回覆</h3>
          <div id="replyList" class="reply-list">
            <p class="muted">還沒有回覆，當第一個吧。</p>
          </div>

          <form id="replyForm" class="reply-form">

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script type="module">
    /*
      你以後只需要改這一段 Firebase 設定。
      如果全部保持空白，網頁會用 demo 模式，資料只存在目前瀏覽器裡。
    */
    const firebaseConfig = {
      apiKey: "AIzaSyDZxsjJOwgAlc4OIOH01V7OZmQZhLldkxU",
      authDomain: "jztapp-31bb8.firebaseapp.com",
      projectId: "jztapp-31bb8",
      storageBucket: "jztapp-31bb8.firebasestorage.app",
      messagingSenderId: "501105409130",
      appId: "1:501105409130:web:d1418a3fa8f7ddad4f5e13"
    };

    /*
      ★ LIFF 設定 ★
      在 LINE Developers Console 建好 LIFF App 後，把它的 LIFF ID 填到下面
      格式像：1234567890-AbCdEfGh
      留空白 = 直接用網頁版（在 LINE 外面打開也能正常運作）
    */
    const LIFF_ID = "2010143431-l2kcIl8v";

    let hasFirebase = Boolean(
      firebaseConfig.apiKey &&
      firebaseConfig.authDomain &&
      firebaseConfig.projectId &&
      firebaseConfig.appId
    );

    let firebaseApi = null;
    let db = null;
    let auth = null;
    let currentUserId = localStorage.getItem("jzt_demo_uid") || crypto.randomUUID();
    localStorage.setItem("jzt_demo_uid", currentUserId);

    // === LIFF 初始化 ===
    // 如果在 LINE 內被打開、且有設 LIFF ID，就跑 LIFF init
    // 如果在外面瀏覽器打開，整段跳過、跟原本一樣運作
    let lineProfile = null;   // 將存放 { userId, displayName, pictureUrl } 之類資訊（可選用途）
    let inLiff = false;

    if (LIFF_ID && typeof liff !== "undefined") {
      try {
        await liff.init({ liffId: LIFF_ID });
        inLiff = liff.isInClient();
        console.log("[LIFF] 初始化完成，inClient =", inLiff);

        // 如果使用者還沒 login（一般網頁開啟 LIFF URL 時會發生），引導他登入
        if (!liff.isLoggedIn()) {
          // C 方案：登入是可選的——只有當使用者要綁定身份時才登入
          // 預設不強迫登入，這樣陌生人點連結進來也能立刻看地圖
          console.log("[LIFF] 未登入，使用匿名模式");
        } else {
          // 如果已經登入，把 LINE userId 當做穩定 UID
          // 這樣同一個人不同裝置打開 LIFF 都會是同一個 ID
          const profile = await liff.getProfile();
          lineProfile = profile;
          // 用 LINE userId 取代隨機 localStorage UID
          // 注意：這只是「ID 的來源」改變，不會洩漏給其他人
          currentUserId = `line_${profile.userId}`;
          localStorage.setItem("jzt_demo_uid", currentUserId);
          console.log("[LIFF] 已登入，userId =", profile.userId.slice(0, 6) + "...");
        }
      } catch (err) {
        console.error("[LIFF] 初始化失敗（不影響網頁版運作）", err);
      }
    }

    if (hasFirebase) {
      try {
        const appModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js");
      const authModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js");
      const firestoreModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js");
      const storageModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js");

      const app = appModule.initializeApp(firebaseConfig);
      auth = authModule.getAuth(app);
      db = firestoreModule.getFirestore(app);
      const storage = storageModule.getStorage(app);
      firebaseApi = { authModule, firestoreModule, storageModule, storage };

      await authModule.signInAnonymously(auth);

      // 重要：Firebase Auth 的 uid 跟我們的 currentUserId 不一定一樣
      // - 沒 LIFF 登入：currentUserId 用 Firebase 匿名 uid（之前邏輯）
      // - 有 LIFF 登入：currentUserId 用 line_xxx（跨裝置穩定）
      // 兩者都會存在 note.authorUid，安全規則只需要驗證 authorUid 等於前端宣稱的 ID
      if (!LIFF_ID || !lineProfile) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem("jzt_demo_uid", currentUserId);
      }
      } catch (err) {
        console.error("[Firebase] 初始化失敗，改用本機模式", err);
        hasFirebase = false;
        firebaseApi = null;
        db = null;
        auth = null;
      }
    }

    const taipei = { lat: 25.033, lng: 121.5654 };
    let currentLocation = { ...taipei };
    let currentCity = "台北";
    let notes = loadDemoNotes();
    let selectedNote = null;
    let selectedReplies = [];
    let currentFilter = "all";
    const NEARBY_RADIUS_METERS = 1000;
    let markersLayer = null;
    let userMarker = null;

    const els = {
      cityButton: document.querySelector("#cityButton"),
      cityText: document.querySelector("#cityText"),
      locateText: document.querySelector("#locateText"),
      locateButton: document.querySelector("#locateButton"),
      refreshButton: document.querySelector("#refreshButton"),
      cityHopButton: document.querySelector("#cityHopButton"),
      nearbyListButton: document.querySelector("#nearbyListButton"),
      nearbySheet: document.querySelector("#nearbySheet"),
      nearbyList: document.querySelector("#nearbyList"),
      openThrowButton: document.querySelector("#openThrowButton"),
      throwSheet: document.querySelector("#throwSheet"),
      pickSheet: document.querySelector("#pickSheet"),
      citySheet: document.querySelector("#citySheet"),
      noteInput: document.querySelector("#noteInput"),
      imageInput: document.querySelector("#imageInput"),
      imagePreview: document.querySelector("#imagePreview"),
      countText: document.querySelector("#countText"),
      submitNoteButton: document.querySelector("#submitNoteButton"),
      throwForm: document.querySelector("#throwForm"),
      pickedContent: document.querySelector("#pickedContent"),
      pickedAuthor: document.querySelector("#pickedAuthor"),
      followButton: document.querySelector("#followButton"),
      pickedCity: document.querySelector("#pickedCity"),
      pickedCount: document.querySelector("#pickedCount"),
      pickedTime: document.querySelector("#pickedTime"),
      replyList: document.querySelector("#replyList"),
      replyForm: document.querySelector("#replyForm"),
      replyInput: document.querySelector("#replyInput"),
      replyCountText: document.querySelector("#replyCountText"),
      submitReplyButton: document.querySelector("#submitReplyButton"),
      stickerRow: document.querySelector("#stickerRow"),
      shareNoteButton: document.querySelector("#shareNoteButton"),
      reportNoteButton: document.querySelector("#reportNoteButton"),
      nearbyAlert: document.querySelector("#nearbyAlert"),
      myNotesButton: document.querySelector("#myNotesButton"),
      myNotesPage: document.querySelector("#myNotesPage"),
      myNotesList: document.querySelector("#myNotesList"),
      myNickname: document.querySelector("#myNickname"),
      cityForm: document.querySelector("#cityForm"),
      cityInput: document.querySelector("#cityInput"),
      cityResults: document.querySelector("#cityResults"),
      toast: document.querySelector("#toast")
    };

    const map = L.map("map", { zoomControl: false }).setView([taipei.lat, taipei.lng], 15);

    /*
      地圖瓦片來源策略：依序嘗試
      1. OSM 國際版（最穩定、線條簡單、全球可用，預設）
      2. NLSC 國土測繪中心（台灣官方圖資、街道全中文）
      3. OSM 台灣中文版（社群維護）

      改變策略原因：在 LINE WebView 內 NLSC 容易被擋（CORS 限制），
      OSM 國際版是業界標準，幾乎不會失敗。
    */
    const TILE_SOURCES = [
      {
        name: "OSM-World",
        url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19
      },
      {
        name: "NLSC",
        url: "https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}",
        attribution: "&copy; 國土測繪中心",
        maxZoom: 18
      },
      {
        name: "OSM-TW",
        url: "https://tile.openstreetmap.tw/tiles/{z}/{x}/{y}.png",
        attribution: "&copy; OSM Taiwan",
        maxZoom: 19
      }
    ];

    let currentTileLayer = null;
    let currentTileIndex = 0;

    function tryTileSource(index) {
      if (index >= TILE_SOURCES.length) {
        console.error("[圖磚] 所有來源都失敗，請檢查網路");
        showToast("地圖載入失敗，請檢查網路");
        return;
      }
      const src = TILE_SOURCES[index];
      console.log(`[圖磚] 嘗試 ${src.name}：${src.url}`);

      if (currentTileLayer) {
        map.removeLayer(currentTileLayer);
      }

      const layer = L.tileLayer(src.url, {
        maxZoom: src.maxZoom || 19,
        attribution: src.attribution
      });

      let errorCount = 0;
      let firstTileLoaded = false;
      let timeoutId = null;

      layer.on("tileerror", (e) => {
        errorCount++;
        console.warn(`[圖磚] ${src.name} 錯誤 #${errorCount}`, e?.tile?.src || "");
        if (!firstTileLoaded && errorCount >= 3) {
          console.warn(`[圖磚] ${src.name} 失敗，切換下一個`);
          clearTimeout(timeoutId);
          tryTileSource(index + 1);
        }
      });

      layer.on("tileload", () => {
        if (!firstTileLoaded) {
          console.log(`[圖磚] ${src.name} 載入成功 ✓`);
          firstTileLoaded = true;
          clearTimeout(timeoutId);
        }
      });

      layer.addTo(map);
      currentTileLayer = layer;
      currentTileIndex = index;

      // 雙保險：6 秒內沒有任何瓦片載入成功，直接切下一個
      timeoutId = setTimeout(() => {
        if (!firstTileLoaded) {
          console.warn(`[圖磚] ${src.name} 6 秒沒回應，切換下一個`);
          tryTileSource(index + 1);
        }
      }, 6000);
    }

    tryTileSource(0);

    // 開場動畫結束後強制重新計算地圖尺寸
    // 為什麼這樣做：splash 動畫期間 z-index 9999 蓋著畫面，Leaflet 可能拿到
    // 錯的容器尺寸；動畫結束時 invalidateSize() 強迫它重算。
    // 為了保險，多次呼叫——時機點難以預測（手機 vs 桌機、字體載入快慢都有差）
    const splashEl = document.querySelector("#splash");
    function fixMapSize(label) {
      map.invalidateSize();
      console.log(`[地圖] invalidateSize 觸發 (${label})`);
    }

    // 1. 動畫淡出完成
    if (splashEl) {
      splashEl.addEventListener("animationend", () => fixMapSize("animationend"));
      splashEl.addEventListener("click", () => setTimeout(() => fixMapSize("user-skip"), 350));
    }
    // 2. 連續觸發三次 invalidateSize，分別在動畫前/中/後
    //    確保任何時機點都至少有一次成功
    setTimeout(() => fixMapSize("500ms"), 500);
    setTimeout(() => fixMapSize("1.2s"), 1200);
    setTimeout(() => fixMapSize("2s"), 2000);
    // 3. 視窗 resize 也重算（手機橫直切換、瀏覽器調大小）
    window.addEventListener("resize", () => fixMapSize("resize"));

    markersLayer = L.layerGroup().addTo(map);
    userMarker = L.marker([taipei.lat, taipei.lng], {
      icon: L.divIcon({
        className: "",
        html: '<div class="user-marker"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      })
    }).addTo(map);

    els.cityButton.addEventListener("click", () => openSheet("city"));
    els.cityHopButton.addEventListener("click", () => openSheet("city"));
    els.locateButton.addEventListener("click", locateMe);
    els.refreshButton.addEventListener("click", async () => {
      els.refreshButton.style.transform = "rotate(360deg)";
      els.refreshButton.style.transition = "transform 0.6s ease";
      await refreshNotes();
      setTimeout(() => {
        els.refreshButton.style.transform = "";
        els.refreshButton.style.transition = "";
      }, 600);
      showToast("已重新整理");
    });
    els.openThrowButton.addEventListener("click", () => openSheet("throw"));
    els.myNotesButton.addEventListener("click", showMyNotes);
    els.nearbyListButton.addEventListener("click", showNearbyList);
    els.nearbyAlert.addEventListener("click", pickNearestNote);
    els.replyInput.addEventListener("input", () => {
      const left = 140 - els.replyInput.value.length;
      els.replyCountText.textContent = `${left} 字`;
      els.submitReplyButton.disabled = els.replyInput.value.trim().length === 0;
    });
    els.replyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = els.replyInput.value.trim().slice(0, 140);
      if (!content || !selectedNote) return;
      await submitReply({ type: "text", content });
      els.replyInput.value = "";
      els.replyCountText.textContent = "140 字";
      els.submitReplyButton.disabled = true;
    });
    els.stickerRow.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-sticker]");
      if (!button || !selectedNote) return;
      await submitReply({ type: "sticker", content: button.dataset.sticker });
    });

    // === 分享紙條給 LINE 朋友 ===
    els.shareNoteButton.addEventListener("click", async () => {
      if (!selectedNote) return;
      const previewText = (selectedNote.content || "圖片紙條").slice(0, 30);

      // 如果在 LIFF 內，用 LINE 的分享選擇器；否則 fallback 到網頁分享
      if (inLiff && typeof liff !== "undefined" && liff.isApiAvailable("shareTargetPicker")) {
        try {
          await liff.shareTargetPicker([{
            type: "text",
            text: `我在丟紙條撿到一張：「${previewText}」\n${window.location.href}`
          }]);
          showToast("已分享");
        } catch (err) {
          console.error(err);
          showToast("分享失敗");
        }
      } else if (navigator.share) {
        try {
          await navigator.share({
            title: "丟紙條",
            text: `我撿到一張紙條：「${previewText}」`,
            url: window.location.href
          });
        } catch (err) {
          // 使用者取消分享，不算錯誤
        }
      } else {
        // 最後手段：複製連結
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast("已複製連結");
        } catch {
          showToast("無法分享");
        }
      }
    });

    // === 追蹤這個人 ===
    els.followButton.addEventListener("click", () => {
      if (!selectedNote) return;
      const newState = toggleFollow(selectedNote.authorUid);
      updateFollowButtonUI(selectedNote.authorUid);
      showToast(newState ? "已追蹤" : "已取消追蹤");
      // 如果目前在地圖上「只看追蹤」篩選模式，重新繪製
      renderNotes();
    });

    // === 檢舉紙條 ===
    els.reportNoteButton.addEventListener("click", async () => {
      if (!selectedNote) return;
      const ok = await customConfirm("確定要檢舉這張紙條？\n達到 3 次檢舉會自動下架。", {
        confirmText: "檢舉", danger: true
      });
      if (!ok) return;
      try {
        await reportNote(selectedNote);
        showToast("已收到檢舉，謝謝你");
        closeSheets();
        await refreshNotes();
      } catch (err) {
        console.error(err);
        showToast("檢舉失敗");
      }
    });
    document.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", closeSheets);
    });

    els.noteInput.addEventListener("input", () => {
      const left = 140 - els.noteInput.value.length;
      els.countText.textContent = `${left} 字`;
      updateThrowButton();
    });

    els.imageInput.addEventListener("change", () => {
      const file = els.imageInput.files?.[0];
      if (!file) {
        els.imagePreview.hidden = true;
        els.imagePreview.removeAttribute("src");
        updateThrowButton();
        return;
      }
      els.imagePreview.src = URL.createObjectURL(file);
      els.imagePreview.hidden = false;
      updateThrowButton();
    });

    els.throwForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = els.noteInput.value.trim().slice(0, 140);
      const imageFile = els.imageInput.files?.[0] || null;
      if (!content && !imageFile) return;

      // === 每日扔紙條次數限制（C 方案：純前端檢查）===
      // 注意：這只擋一般使用者，懂技術的人可以繞過。
      // 想真正鎖死要寫 Firestore 規則 + Cloud Function。
      const DAILY_LIMIT = 10;
      const today = new Date().toISOString().slice(0, 10);  // YYYY-MM-DD
      const usage = JSON.parse(localStorage.getItem("jzt_daily_usage") || "{}");
      const todayCount = usage.date === today ? (usage.count || 0) : 0;
      if (todayCount >= DAILY_LIMIT) {
        showToast(`今天已經扔 ${DAILY_LIMIT} 張了，明天再來吧`);
        return;
      }

      const note = {
        id: crypto.randomUUID(),
        authorUid: currentUserId,
        type: imageFile ? "image" : "text",
        content,
        imageUrl: "",
        location: { ...currentLocation },
        city: currentCity,
        createdAt: new Date().toISOString(),
        expiresAt: addDays(new Date(), 30).toISOString(),
        pickedCount: 0,
        replyCount: 0,
        isSeed: false
      };

      try {
        // 加上「處理中」狀態，避免使用者以為按鈕沒反應
        els.submitNoteButton.disabled = true;
        els.submitNoteButton.textContent = "處理中…";

        if (imageFile) {
          note.imageUrl = await uploadNoteImage(imageFile);
          if (!note.content) note.content = "圖片紙條";
        }
        await saveNote(note);
        notes.unshift(note);
        saveDemoNotes();

        // 更新今日扔紙條次數
        localStorage.setItem("jzt_daily_usage", JSON.stringify({
          date: today,
          count: todayCount + 1
        }));

        els.noteInput.value = "";
        els.imageInput.value = "";
        els.imagePreview.hidden = true;
        els.imagePreview.removeAttribute("src");
        els.countText.textContent = "140 字";
        els.submitNoteButton.textContent = "扔出去";
        closeSheets();
        renderNotes();
        const remaining = DAILY_LIMIT - todayCount - 1;
        showToast(`紙條已輕輕放下（今日剩 ${remaining} 次）`);
      } catch (error) {
        console.error("[扔紙條失敗]", error);
        const msg = error?.message || "未知錯誤";
        showToast(`扔失敗：${msg}`);
        els.submitNoteButton.textContent = "扔出去";
        els.submitNoteButton.disabled = false;
      }
    });

    els.cityForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const keyword = els.cityInput.value.trim();
      if (!keyword) return;
      els.cityResults.innerHTML = '<p class="muted">搜尋中…</p>';
      const results = await searchCity(keyword);
      if (results.length === 0) {
        els.cityResults.innerHTML = '<p class="muted">找不到結果，換個關鍵字試試。</p>';
        return;
      }
      els.cityResults.innerHTML = "";
      results.forEach((result) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "result-row";
        button.textContent = result.city;
        button.addEventListener("click", async () => {
          currentCity = result.city;
          currentLocation = result.center;
          map.setView([result.center.lat, result.center.lng], 15);
          userMarker.setLatLng([result.center.lat, result.center.lng]);

    /*
      抽屜手勢：往下滑可關閉
      只在標題列範圍內偵測，避免內容滾動衝突
    */
    function attachSwipeDownToClose(sheet) {
      const header = sheet.querySelector(".sheet-header");
      if (!header) return;

      let startY = 0;
      let currentY = 0;
      let dragging = false;

      header.addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
        currentY = startY;
        dragging = true;
      }, { passive: true });

      header.addEventListener("touchmove", (e) => {
        if (!dragging) return;
        currentY = e.touches[0].clientY;
        const dy = currentY - startY;
        if (dy > 0) {
          sheet.classList.add("dragging");
          sheet.style.transform = `translateY(${dy}px)`;
        }
      }, { passive: true });

      header.addEventListener("touchend", () => {
        if (!dragging) return;
        dragging = false;
        const dy = currentY - startY;
        sheet.classList.remove("dragging");
        sheet.style.transform = "";
        // 拖超過 80px 就視為關閉
        if (dy > 80) {
          sheet.classList.remove("open");
        }
      });
    }

    // 對所有抽屜啟用滑動關閉
    document.querySelectorAll(".sheet").forEach(attachSwipeDownToClose);

      const nearbyCount = notes.filter((note) => distanceMeters(currentLocation, note.location) <= NEARBY_RADIUS_METERS).length;

    function renderNotes() {
      markersLayer.clearLayers();

      // 套用使用者選的篩選器
      const visibleNotes = applyFilter(notes).filter((note) =>
        distanceMeters(currentLocation, note.location) <= NEARBY_RADIUS_METERS ||
        note.authorUid === currentUserId
      );

      visibleNotes.forEach((note) => {
        const isMine = note.authorUid === currentUserId;
        const isFollowed = isFollowing(note.authorUid);
        const hasImage = note.imageUrl && note.type === "image";

        // 決定 marker class
        let extraClass = "";
        if (isMine) extraClass = "mine";
        else if (isFollowed) extraClass = "followed";

        // 決定 marker HTML
        let markerHtml;
        let iconSize;
        if (hasImage) {
          // 圖片紙條：顯示縮圖
          const escapedUrl = note.imageUrl.replaceAll('"', '&quot;');
          markerHtml = `<div class="paper-marker image-marker ${extraClass}"><img src="${escapedUrl}" alt="" /></div>`;
          iconSize = 44;
        } else {
          // 文字紙條：用 emoji 顯示
          let emoji = "📃";
          if (isMine) emoji = "📜";
          else if (isFollowed) emoji = "📨";  // 追蹤中的人有獨特圖示
          markerHtml = `<div class="paper-marker ${extraClass}">${emoji}</div>`;
          iconSize = 36;
        }

        const marker = L.marker([note.location.lat, note.location.lng], {
          title: note.content || "圖片紙條",
          icon: L.divIcon({
            className: "",
            html: markerHtml,
            iconSize: [iconSize, iconSize],
            iconAnchor: [iconSize / 2, iconSize / 2]
          })
        });

        marker.on("click", () => pickNote(note));
        marker.addTo(markersLayer);
      });

      const nearby = visibleNotes.filter((note) =>
        note.authorUid !== currentUserId &&
        distanceMeters(currentLocation, note.location) <= NEARBY_RADIUS_METERS
      );
      if (nearby.length > 0) {
        els.nearbyAlert.textContent = `附近有 ${nearby.length} 張紙條，點我撿起`;
        els.nearbyAlert.classList.add("show");

        els.nearbyAlert.classList.remove("show");

      const nearest = notes
        .filter((note) => note.authorUid !== currentUserId)
        .map((note) => ({
          note,
          distance: distanceMeters(currentLocation, note.location)

        .filter((item) => item.distance <= NEARBY_RADIUS_METERS)
        .sort((a, b) => a.distance - b.distance)[0];

    async function saveNote(note) {
      if (!hasFirebase) return;
      const {
        addDoc,
        collection,
        GeoPoint,
        serverTimestamp,
        Timestamp
      } = firebaseApi.firestoreModule;

      const expiresAt = addDays(new Date(), 30);
      const docRef = await addDoc(collection(db, "notes"), {
        authorUid: currentUserId,
        type: note.type,
        content: note.content,
        imageUrl: note.imageUrl || "",
        location: new GeoPoint(note.location.lat, note.location.lng),
        city: note.city,
        geohash: `${note.location.lat.toFixed(3)},${note.location.lng.toFixed(3)}`,
        createdAt: serverTimestamp(),

        lastDriftAt: serverTimestamp()

    /**
     * 把圖片檔案壓縮並轉成 base64 data URL
     * 為什麼這樣做：直接存 base64 到 Firestore，繞過 Storage 規則設定
     * Firestore 單一文件上限 1MB，所以一定要壓縮
     *   - 縮到最長邊 1024px
     *   - JPEG 品質 0.75
     *   - 一般手機照片壓完約 80-200KB
     */
    async function uploadNoteImage(file) {
      const dataUrl = await compressImageToDataUrl(file, 1024, 0.75);
      const sizeKb = Math.round(dataUrl.length * 0.75 / 1024);  // base64 約 4/3 倍
      console.log(`[圖片] 壓縮後約 ${sizeKb} KB`);

      // Firestore 限制 1MB，留點餘裕，超過 800KB 拒絕
      if (dataUrl.length > 800 * 1024) {
        throw new Error(`圖片壓縮後仍太大（${sizeKb} KB），請換一張`);
      }
      return dataUrl;
    }

    function compressImageToDataUrl(file, maxSide = 1024, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let { width, height } = img;
            // 等比縮到最長邊不超過 maxSide
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round(height * maxSide / width);
                width = maxSide;
              } else {
                width = Math.round(width * maxSide / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function deleteMyNote(note) {
      notes = notes.filter((item) => item.id !== note.id);
      saveDemoNotes();

      if (!hasFirebase || note.id.startsWith("seed-")) return;
      if (note.authorUid !== currentUserId) {
        showToast("只能刪除自己的紙條");
        return;
      }

      const { deleteDoc, doc } = firebaseApi.firestoreModule;
      await deleteDoc(doc(db, "notes", note.id));
    }

    async function saveReply(note, reply) {
      if (!hasFirebase || note.id.startsWith("seed-")) {
        const key = `jzt_replies_${note.id}`;
        const saved = JSON.parse(localStorage.getItem(key) || "[]");
        saved.unshift(reply);
        localStorage.setItem(key, JSON.stringify(saved));
        return;
      }

      const {
        addDoc,
        collection,
        doc,
        increment,
        serverTimestamp,
        updateDoc
      } = firebaseApi.firestoreModule;

      await addDoc(collection(db, "notes", note.id, "replies"), {
        authorUid: currentUserId,
        type: reply.type,
        content: reply.content,
        createdAt: serverTimestamp()
      });

      await updateDoc(doc(db, "notes", note.id), {
        replyCount: increment(1)
      });
    }

    async function loadReplies(note) {
      if (!hasFirebase || note.id.startsWith("seed-")) {
        const key = `jzt_replies_${note.id}`;
        return JSON.parse(localStorage.getItem(key) || "[]");
      }

      const {
        collection,
        getDocs,
        limit,
        orderBy,
        query
      } = firebaseApi.firestoreModule;

      const snapshot = await getDocs(
        query(
          collection(db, "notes", note.id, "replies"),
          orderBy("createdAt", "desc"),
          limit(30)
        )
      );

      return snapshot.docs.map((doc) => {
        const data = doc.data();
        return {
          id: doc.id,
          authorUid: data.authorUid,
          type: data.type,
          content: data.content,
          createdAt: data.createdAt?.toDate?.().toISOString() || new Date().toISOString()
        };
      });
    }

    async function loadFirebaseNotes() {
      const {
        collection,
        getDocs,
        limit,
        orderBy,
        query
      } = firebaseApi.firestoreModule;

      const snapshot = await getDocs(
        query(
          collection(db, "notes"),
          orderBy("createdAt", "desc"),
          limit(100)
        )
      );

      const all = snapshot.docs.map((doc) => {
        const data = doc.data();
        return {
          id: doc.id,
          authorUid: data.authorUid,
          type: data.type,
          content: data.content,
          imageUrl: data.imageUrl || "",
          location: {
            lat: data.location.latitude,
            lng: data.location.longitude
          },
          city: data.city,
          createdAt: data.createdAt?.toDate?.().toISOString() || new Date().toISOString(),
          expiresAt: data.expiresAt?.toDate?.().toISOString() || addDays(new Date(), 30).toISOString(),
          pickedCount: data.pickedCount || 0,
          replyCount: data.replyCount || 0,
          reportCount: data.reportCount || 0,
          isSeed: Boolean(data.isSeed)
        };
      });

      // 過濾掉被檢舉 3 次以上的紙條
      // 例外：自己丟的還是看得到（讓使用者知道自己被檢舉了）
      return all.filter((note) =>
        note.reportCount < 3 || note.authorUid === currentUserId
      );
    }

    // === 檢舉紙條：用 array 記錄誰檢舉過，避免重複檢舉 ===
    async function reportNote(note) {
      if (note.id.startsWith("seed-")) {
        showToast("這是示範紙條，無法檢舉");
        return;
      }
      if (!hasFirebase) {
        showToast("Demo 模式無法檢舉");
        return;
      }
      const { doc, updateDoc, arrayUnion, increment } = firebaseApi.firestoreModule;
      await updateDoc(doc(db, "notes", note.id), {
        reportedBy: arrayUnion(currentUserId),
        reportCount: increment(1)
      });
    }

    async function updatePickedCount(note) {
      if (!hasFirebase || note.id.startsWith("seed-")) return;
      const { doc, increment, updateDoc } = firebaseApi.firestoreModule;
      await updateDoc(doc(db, "notes", note.id), {
        pickedCount: increment(1)
      });
    }

    async function reverseCity(location) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/reverse");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("lat", String(location.lat));
        url.searchParams.set("lon", String(location.lng));
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.address?.city || data.address?.town || data.address?.county || data.address?.state || "附近";
      } catch {
        return "附近";
      }
    }

    async function searchCity(keyword) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/search");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("q", keyword);
        url.searchParams.set("limit", "5");
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.map((item) => ({
          city: item.display_name.split(",")[0],
          center: { lat: Number(item.lat), lng: Number(item.lon) }
        }));
      } catch {
        return [];
      }
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    /*
      ============= 匿名綽號系統 =============
      根據 UID 生成穩定的「形容詞 + 動物 + #編號」
      同一個 UID 永遠生成同一個綽號
      範例：沉默的螢火蟲 #4291、漂泊的水獺 #1023
    */
    const NICKNAME_ADJECTIVES = [
      "沉默的", "漂泊的", "夜行的", "輕盈的", "悠遊的", "勇敢的",
      "溫柔的", "認真的", "清晨的", "黃昏的", "雨後的", "迷路的",
      "好奇的", "做夢的", "微笑的", "靜謐的", "閃爍的", "獨自的",
      "遠方的", "聆聽的", "守候的", "走神的", "懷舊的", "出走的",
      "唱歌的", "畫畫的", "釣魚的", "散步的", "種花的", "聞香的"
    ];
    const NICKNAME_ANIMALS = [
      "螢火蟲", "水獺", "灰鷺", "鯨魚", "麻雀", "白鴿", "貓頭鷹",
      "刺蝟", "松鼠", "袋鼠", "海豹", "狐狸", "海星", "蝸牛",
      "兔子", "鹿", "羚羊", "山雀", "燕子", "海鷗", "鯨豚",
      "獾", "土撥鼠", "穿山甲", "貉", "石虎", "雲豹", "黑熊",
      "藍鵲", "綠繡眼", "夜鶯", "杜鵑", "信天翁", "企鵝", "海馬"
    ];

    // 把 UID 字串雜湊成一個非負整數
    function hashStr(str) {
      let h = 5381;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) + h) + str.charCodeAt(i);
        h = h & 0xffffffff;  // 保持 32 bit
      }
      return Math.abs(h);
    }

    function nicknameOf(uid) {
      if (!uid) return "路過的旅人";
      if (uid === "seed") return "投條問路使者";
      const h = hashStr(uid);
      const adj = NICKNAME_ADJECTIVES[h % NICKNAME_ADJECTIVES.length];
      const ani = NICKNAME_ANIMALS[Math.floor(h / NICKNAME_ADJECTIVES.length) % NICKNAME_ANIMALS.length];
      const num = (h % 9000) + 1000;  // 1000~9999 編號
      return `${adj}${ani} #${num}`;
    }

    /*
      ============= 追蹤系統 =============
      存「我追蹤的 UID」清單到 localStorage
      純前端設計：每個人的追蹤名單只在自己瀏覽器、不上 Firebase
      優點：不動 Firestore 規則、零後端成本、不影響別人隱私
      缺點：換裝置會遺失（如果用 LIFF 登入 LINE，跨裝置 UID 一樣但追蹤名單不同步）
    */
    function getFollowedUids() {
      try {
        return new Set(JSON.parse(localStorage.getItem("jzt_following") || "[]"));
      } catch {
        return new Set();
      }
    }

    function isFollowing(uid) {
      return getFollowedUids().has(uid);
    }

    function toggleFollow(uid) {
      const set = getFollowedUids();
      if (set.has(uid)) {
        set.delete(uid);
        localStorage.setItem("jzt_following", JSON.stringify([...set]));
        return false;  // 已取消追蹤
      } else {
        set.add(uid);
        localStorage.setItem("jzt_following", JSON.stringify([...set]));
        return true;   // 已追蹤
      }
    }

    function updateFollowButtonUI(uid) {
      const following = isFollowing(uid);
      els.followButton.textContent = following ? "✓ 追蹤中" : "+ 追蹤";
      els.followButton.classList.toggle("following", following);
    }

    function distanceMeters(a, b) {
      const earthRadius = 6371000;
      const toRad = (value) => value * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * earthRadius * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    /*
      自製對話框：取代原生 alert/confirm，配合法式繪本風格
      用法：
        const ok = await customConfirm("要刪除嗎？");
        if (ok) ...
        await customAlert("已刪除");
    */
    const dialogBackdrop = document.querySelector("#dialogBackdrop");
    const dialogMessage = document.querySelector("#dialogMessage");
    const dialogConfirm = document.querySelector("#dialogConfirm");
    const dialogCancel = document.querySelector("#dialogCancel");

    function customConfirm(message, { confirmText = "確定", cancelText = "取消", danger = false } = {}) {
      return new Promise((resolve) => {
        dialogMessage.textContent = message;
        dialogConfirm.textContent = confirmText;
        dialogCancel.textContent = cancelText;
        dialogCancel.style.display = "";
        // 標示危險動作（紅色按鈕）
        dialogConfirm.classList.toggle("danger-button", danger);
        dialogConfirm.classList.toggle("primary-button", !danger);

        dialogBackdrop.classList.add("show");

        const onConfirm = () => { cleanup(); resolve(true); };
        const onCancel = () => { cleanup(); resolve(false); };
        const onBackdrop = (e) => { if (e.target === dialogBackdrop) onCancel(); };

        function cleanup() {
          dialogBackdrop.classList.remove("show");
          dialogConfirm.removeEventListener("click", onConfirm);
          dialogCancel.removeEventListener("click", onCancel);
          dialogBackdrop.removeEventListener("click", onBackdrop);
        }

        dialogConfirm.addEventListener("click", onConfirm);
        dialogCancel.addEventListener("click", onCancel);
        dialogBackdrop.addEventListener("click", onBackdrop);
      });
    }

    function customAlert(message, { confirmText = "好" } = {}) {
      return new Promise((resolve) => {
        dialogMessage.textContent = message;
        dialogConfirm.textContent = confirmText;
        dialogCancel.style.display = "none";
        dialogConfirm.classList.add("primary-button");
        dialogConfirm.classList.remove("danger-button");

        dialogBackdrop.classList.add("show");

        const onConfirm = () => {
          dialogBackdrop.classList.remove("show");
          dialogCancel.style.display = "";  // 恢復
          dialogConfirm.removeEventListener("click", onConfirm);
          resolve();
        };
        dialogConfirm.addEventListener("click", onConfirm);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
