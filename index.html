<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbeed4" />
  <title>丟紙條</title>

  <!-- 法式繪本字體：Caveat（手寫流暢）+ Patrick Hand（手寫工整）+ 思源中文 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Patrick+Hand&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <!-- Leaflet（不用 integrity，避免 CDN 更新後雜湊不符被擋） -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    /* ================================================================
       設計哲學：法式繪本（Storybook illustration）
       靈感：Sempé、Tomi Ungerer、Jean Jullien、《小王子》
       特徵：粗墨線、手繪不對稱、暖色塊、紙巾紋理、手寫字
       ================================================================ */

    :root {
      /* 主色票：莫蘭迪 × 馬諦斯 */
      --paper:        #fbeed4;   /* 主背景：奶黃信紙 */
      --paper-light:  #fff8e3;   /* 卡片底：更亮的奶油 */
      --paper-warm:   #f0d9aa;   /* 暖色塊 */
      --ink:          #1f1812;   /* 主墨色（不是純黑，更柔和） */
      --ink-soft:     #5a4536;
      --muted:        #9a8870;

      /* 強調色 */
      --tomato:       #d94f3d;   /* 番茄紅（主強調色，按鈕、自己） */
      --tomato-deep:  #a8311f;
      --mustard:      #e6a724;   /* 芥末黃（標題、別人紙條） */
      --olive:        #6b8e4e;   /* 橄欖綠（次要） */
      --sky:          #6ba8c4;   /* 天空藍（裝飾） */
      --rose:         #e8a09c;   /* 玫瑰粉（柔和強調） */

      --shadow-sm: 2px 3px 0 var(--ink);
      --shadow-md: 3px 4px 0 var(--ink);
      --shadow-lg: 4px 6px 0 var(--ink);

      font-family: "Patrick Hand", "Caveat", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; }

    body.is-booting .splash {
      pointer-events: auto;
    }

    body:not(.is-booting) .splash.ready {
      display: none;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--paper);
      /* 法式繪本紙巾紋理：兩層斑點 + 一層淡漸層 */
      background-image:
        /* 紙張顆粒 */
        radial-gradient(circle at 20% 30%, rgba(217, 79, 61, 0.05) 0%, transparent 4%),
        radial-gradient(circle at 80% 70%, rgba(107, 142, 78, 0.04) 0%, transparent 5%),
        radial-gradient(circle at 50% 20%, rgba(230, 167, 36, 0.04) 0%, transparent 4%),
        /* 紙張纖維 */
        repeating-linear-gradient(
          37deg,
          transparent 0 3px,
          rgba(31, 24, 18, 0.012) 3px 4px
        ),
        repeating-linear-gradient(
          120deg,
          transparent 0 5px,
          rgba(31, 24, 18, 0.01) 5px 6px
        );
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ========== 開場動畫 ========== */
    /* 進入時蓋全螢幕，等首頁資源就緒後自動淡出 */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--paper);
      background-image:
        radial-gradient(circle at 30% 30%, rgba(230, 167, 36, 0.15), transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(217, 79, 61, 0.1), transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: auto;
    }
    /* 首頁載入完成後自動淡出 */
    .splash.ready {
      animation: splashFade 0.4s ease-out forwards;
    }
    @keyframes splashFade {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    .splash-scene {
      position: relative;
      width: 320px;
      height: 120px;
      overflow: hidden;
    }

    .splash-bird {
      position: absolute;
      width: 80px;
      height: 80px;
      top: 20px;
      left: -90px;
      animation: birdFlyLoop 2.4s linear infinite;
    }
    @keyframes birdFlyLoop {
      0%   { transform: translateX(0) translateY(0) rotate(-3deg); opacity: 0; }
      6%   { opacity: 1; }
      30%  { transform: translateX(100px) translateY(-8px) rotate(2deg); }
      60%  { transform: translateX(220px) translateY(-4px) rotate(-1deg); }
      88%  { transform: translateX(400px) translateY(0) rotate(3deg); opacity: 1; }
      94%  { opacity: 0; }
      100% { transform: translateX(0) translateY(0) rotate(-3deg); opacity: 0; }
    }

    .splash-wing {
      transform-origin: 35px 30px;
      animation: wingFlap 0.25s ease-in-out infinite alternate;
    }
    @keyframes wingFlap {
      from { transform: rotate(-15deg); }
      to   { transform: rotate(35deg); }
    }

    .splash-title {
      font-family: "Caveat", cursive;
      font-size: 56px;
      font-weight: 700;
      color: var(--ink);
      text-shadow: 3px 3px 0 var(--mustard);
      letter-spacing: 0.05em;
      transform: rotate(-2deg);
      margin: 0;
      animation: splashTitle 0.5s ease-out 0.2s both;
    }
    @keyframes splashTitle {
      from { opacity: 0; transform: rotate(-2deg) translateY(20px); }
      to   { opacity: 1; transform: rotate(-2deg) translateY(0); }
    }

    .splash-subtitle {
      font-size: 15px;
      color: var(--ink-soft);
      letter-spacing: 0.2em;
      margin: 0;
      animation: splashTitle 0.5s ease-out 0.4s both;
    }

    /* ========== 地圖 ========== */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      /* 法式繪本暖色濾鏡：略飽和、偏黃 */
      filter: sepia(0.15) saturate(0.85) brightness(1.04) contrast(1.03);
    }

    /* Leaflet 必要樣式 */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow,
    .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas,
    .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer {
      position: absolute; left: 0; top: 0;
    }
    .leaflet-container {
      overflow: hidden;
      touch-action: pan-x pan-y;
      background: #e8dcc0;
      font-family: inherit;
    }
    .leaflet-tile { visibility: hidden; border: 0; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-animated { transform-origin: 0 0; }
    .leaflet-interactive { cursor: pointer; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: auto; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-control-zoom, .leaflet-control-attribution { display: none; }

    /* ========== 頂部「投條位置」欄 ========== */
    .top-bar {
      position: absolute;
      z-index: 500;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .city-button {
      pointer-events: auto;
      max-width: min(440px, 100%);
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      /* 法式繪本：粗墨線、不對稱圓角 */
      border: 2.5px solid var(--ink);
      border-radius: 24px 30px 26px 28px;
      background: var(--paper-light);
      box-shadow: var(--shadow-md);
      color: var(--ink);
      font-weight: 700;
      font-size: 16px;
      transform: rotate(-0.5deg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .city-button:active {
      transform: rotate(-0.5deg) translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .city-button::before {
      content: "📍";
      font-size: 18px;
      flex-shrink: 0;
    }

    .city-button #cityText {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-button #locateText {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--mustard);
      border: 2px solid var(--ink);
      transform: rotate(2deg);
    }

    /* ========== 篩選器 ========== */
    .filter-bar {
      position: absolute;
      z-index: 500;
      top: calc(max(16px, env(safe-area-inset-top)) + 64px);
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
      pointer-events: none;
    }
    .filter-pill {
      pointer-events: auto;
      padding: 6px 14px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--paper-light);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }
    .filter-pill:nth-child(1) { transform: rotate(-1deg); }
    .filter-pill:nth-child(2) { transform: rotate(1deg); }
    .filter-pill:nth-child(3) { transform: rotate(-1deg); }
    .filter-pill.active {
      background: var(--tomato);
      color: var(--paper);
    }
    .filter-pill:active {
      transform: translate(2px, 2px) rotate(0) !important;
      box-shadow: 0 0 0 var(--ink);
    }

    /* ========== 右側懸浮控制鈕 ========== */
    .side-controls {
      position: absolute;
      z-index: 500;
      right: 16px;
      bottom: calc(150px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side-button {
      width: 52px;
      height: 52px;
      /* 不對稱圓角 - 像手繪的圓 */
      border-radius: 50% 48% 52% 50%;
      background: var(--paper-light);
      border: 2.5px solid var(--ink);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .side-button:nth-child(1) { transform: rotate(-3deg); }
    .side-button:nth-child(2) { transform: rotate(2deg); }
    .side-button:nth-child(3) { transform: rotate(-1deg); }

    .side-button:active {
      transform: rotate(0deg) translate(2px, 3px) !important;
      box-shadow: 1px 1px 0 var(--ink);
    }

    .side-button svg {
      width: 24px;
      height: 24px;
      stroke: var(--ink);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .side-button.locating {
      background: var(--tomato);
    }
    .side-button.locating svg { stroke: var(--paper); }

    /* ========== 底部三欄（固定下方；抽屜 z-index 更高會蓋住） ========== */
    .bottom-bar {
      position: absolute;
      z-index: 700;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 0 calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      pointer-events: none;
      background: linear-gradient(to top, rgba(251, 238, 212, 0.96) 30%, rgba(251, 238, 212, 0) 100%);
    }

    .bottom-tab {
      pointer-events: auto;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      justify-self: center;
      min-width: 70px;
    }

    .bottom-tab svg {
      width: 28px;
      height: 28px;
      stroke: var(--ink);
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom-tab.left { justify-self: start; padding-left: 28px; }
    .bottom-tab.right { justify-self: end; padding-right: 28px; }
    .bottom-tab.active { color: var(--tomato); }
    .bottom-tab:active { transform: translateY(2px); }

    /* ★ 中央大紙團「扔」按鈕 ★ */
    .throw-paper-ball {
      pointer-events: auto;
      width: 130px;
      height: 130px;
      position: relative;
      transform: translateY(-18px);
      cursor: pointer;
      animation: paperFloat 4s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .throw-paper-ball img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      /* 法式繪本硬陰影：用 drop-shadow 模擬 */
      filter: drop-shadow(2px 4px 0 rgba(31, 24, 18, 0.18));
    }

    /* 剩餘次數用 HTML 疊在 PNG 上方，避免被紙團線條遮住 */
    .throw-ball-remaining {
      position: absolute;
      left: 50%;
      bottom: 27%;
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: rgba(255, 248, 227, 0.94);
      padding: 2px 8px 3px;
      border-radius: 999px;
      box-shadow: 0 0 0 1.5px rgba(255, 248, 227, 0.85);
      line-height: 1.2;
    }

    .throw-paper-ball:active {
      transform: translateY(-14px) scale(0.92);
      animation: none;
    }

    @keyframes paperFloat {
      0%, 100% { transform: translateY(-18px) rotate(-3deg); }
      50%      { transform: translateY(-24px) rotate(3deg); }
    }

    /* ========== Marker（地圖上的紙條圖示） ========== */
    /* 別人的紙條：芥末黃 + 粗墨線 */
    .paper-marker {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      background: var(--mustard);
      border: 2.5px solid var(--ink);
      /* 手繪不對稱圓角 */
      border-radius: 8px 12px 7px 10px;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(-6deg);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .paper-marker:hover { transform: rotate(-6deg) scale(1.15); }

    /* 自己的紙條：番茄紅 */
    .paper-marker.mine {
      background: var(--tomato);
      color: var(--paper);
    }

    /* 追蹤中的人的紙條：天空藍 */
    .paper-marker.followed {
      background: var(--sky);
      color: var(--paper);
    }
    .paper-marker.followed::before {
      background: var(--olive);
    }

    /* 圖片紙條 */
    .paper-marker.image-marker {
      width: 46px;
      height: 46px;
      padding: 3px;
      background: var(--paper-light);
      border-radius: 6px 10px 7px 9px;
      transform: rotate(-4deg);
    }
    .paper-marker.image-marker.mine {
      background: var(--tomato);
    }
    .paper-marker.image-marker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      pointer-events: none;
      user-select: none;
    }

    /* 右上角小圓點（像郵戳） */
    .paper-marker::before {
      content: "";
      position: absolute;
      top: -5px;
      right: -5px;
      width: 12px;
      height: 12px;
      background: var(--tomato);
      border: 2px solid var(--ink);
      border-radius: 50%;
    }
    .paper-marker.mine::before {
      background: var(--olive);
    }

    /* 使用者位置標記（藍點） */
    .user-marker {
      width: 22px;
      height: 22px;
      background: var(--sky);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(107, 168, 196, 0.25), 2px 3px 0 var(--ink);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px rgba(107, 168, 196, 0.25), 2px 3px 0 var(--ink); }
      50%      { box-shadow: 0 0 0 12px rgba(107, 168, 196, 0.1), 2px 3px 0 var(--ink); }
    }

    /* ========== 底部抽屜 ========== */
    .sheet {
      position: absolute;
      z-index: 850;
      left: 8px;
      right: 8px;
      bottom: 0;
      max-height: min(80vh, 620px);
      padding: 22px 22px calc(28px + env(safe-area-inset-bottom));
      /* 不對稱圓角 + 粗墨線 */
      border-radius: 24px 28px 0 0;
      background: var(--paper-light);
      border: 2.5px solid var(--ink);
      border-bottom: 0;
      box-shadow: 0 -4px 0 var(--ink);
      overflow-x: hidden;
      overflow-y: auto;
      transform: translateY(110%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sheet.open {
      z-index: 1000;
      transform: translateY(0) !important;
      pointer-events: auto;
    }

    /* 抽屜開啟時地圖、底欄、提示不攔點擊 */
    #app.has-sheet-open #map,
    #app.has-sheet-open .bottom-bar,
    #app.has-sheet-open .alert {
      pointer-events: none;
    }

    #pickSheet {
      max-height: min(88vh, 680px);
    }

    #replySheet {
      max-height: calc(100vh - 16px);
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .reply-footer {
      flex-shrink: 0;
      padding: 14px 0 4px;
      border-top: 2.5px dashed var(--ink);
      margin-top: auto;
    }
    .reply-compose-trigger {
      width: 100%;
    }

    .reply-compose-backdrop {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: rgba(31, 24, 18, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .reply-compose-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .reply-compose-drawer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      max-height: min(72vh, 520px);
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--paper-light);
      border-top: 2.5px solid var(--ink);
      border-radius: 20px 24px 0 0;
      padding: 14px 18px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -4px 0 var(--ink);
    }
    .reply-compose-drawer.open {
      transform: translateY(0);
    }
    .reply-compose-header {
      margin-bottom: 10px;
    }
    .reply-compose-header h3 {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink);
    }
    .reply-compose-drawer .reply-form {
      margin-top: 0;
    }
    .reply-sticker-block {
      margin-top: 12px;
    }
    .reply-sticker-block .muted {
      margin: 0 0 8px;
    }

    /* 高版抽屜：用於「我的紙條」這種內容多的，撐到接近全螢幕 */
    .sheet-tall {
      max-height: calc(100vh - 40px);
      min-height: 70vh;
    }

    /* 拖拉中的抽屜暫時關閉動畫，直接跟手指 */
    .sheet.dragging {
      transition: none;
    }

    /* 抽屜頂部小握把 */
    .sheet::before {
      content: "";
      display: block;
      width: 48px;
      height: 5px;
      border-radius: 3px;
      background: var(--ink);
      margin: -10px auto 16px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .sheet-header h2 {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 32px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
      transform: rotate(-1deg);
      position: relative;
    }
    /* 標題下面的手繪曲線 */
    .sheet-header h2::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -6px;
      height: 6px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M2,3 Q25,0 50,3 T98,3' stroke='%23d94f3d' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
    }

    .close-button {
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--ink);
      border-radius: 50% 48% 52% 50%;
      background: var(--paper);
      color: var(--ink);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(3deg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .close-button:active {
      transform: rotate(3deg) translate(2px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    .back-button {
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--ink);
      border-radius: 50% 48% 52% 50%;
      background: var(--paper);
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 2px 3px 0 var(--ink);
      flex-shrink: 0;
    }
    .back-button:active {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    .sheet-header-with-back h2 {
      flex: 1;
      text-align: center;
    }

    /* ========== 表單元素 ========== */
    textarea, input[type="text"], input:not([type]), input[type="search"] {
      width: 100%;
      border: 2.5px solid var(--ink);
      border-radius: 12px 14px 11px 13px;
      padding: 14px;
      background: var(--paper);
      color: var(--ink);
      outline: none;
      font-size: 16px;
      line-height: 1.7;
      font-family: "Patrick Hand", "Caveat", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      resize: vertical;
      box-shadow: var(--shadow-sm);
      /* 信紙橫線 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 30px,
        rgba(31, 24, 18, 0.12) 30px,
        rgba(31, 24, 18, 0.12) 31px
      );
      background-position: 0 14px;
      transition: box-shadow 0.15s ease, transform 0.1s ease;
    }
    input[type="text"], input:not([type]), input[type="search"] {
      background-image: none;
      padding: 12px 14px;
    }
    textarea:focus, input:focus {
      box-shadow: 3px 5px 0 var(--tomato);
    }

    input[type="file"] {
      width: 100%;
      border: 2.5px dashed var(--ink);
      border-radius: 12px;
      padding: 10px 14px;
      background: var(--paper);
      font-family: inherit;
      color: var(--ink-soft);
    }

    .throw-form, .picked-note, .reply-form {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .picked-note {
      overflow-x: hidden;
      max-width: 100%;
    }

    .city-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
    }

    /* ========== 按鈕（法式繪本三色：番茄、芥末、奶油） ========== */
    .primary-button, .secondary-button, .danger-button {
      min-height: 48px;
      border: 2.5px solid var(--ink);
      border-radius: 12px 16px 13px 14px;
      padding: 0 22px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
      box-shadow: var(--shadow-md);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .primary-button {
      background: var(--tomato);
      color: var(--paper);
    }
    .primary-button:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .primary-button:disabled {
      background: var(--paper-warm);
      color: var(--muted);
      cursor: not-allowed;
    }
    .primary-button:disabled:active {
      transform: none;
      box-shadow: var(--shadow-md);
    }

    .secondary-button {
      background: var(--mustard);
      color: var(--ink);
    }
    .secondary-button:active {
      transform: translate(2px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .danger-button {
      background: var(--ink);
      color: var(--paper);
      min-height: 42px;
      padding: 0 18px;
      box-shadow: 2px 3px 0 var(--tomato);
    }
    .danger-button:active {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 var(--tomato);
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ========== 撿到紙條 - 主體 ========== */
    /* 作者列：綽號 + 追蹤按鈕 */
    .picked-author-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    /* 紙條來自誰 - 匿名綽號 */
    .picked-author {
      margin: 0 0 4px 4px;
      font-family: "Caveat", cursive;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      transform: rotate(-1deg);
      display: inline-block;
      padding: 4px 14px;
      background: var(--mustard);
      border: 2.5px solid var(--ink);
      border-radius: 14px 16px 13px 15px;
      box-shadow: 2px 3px 0 var(--ink);
    }
    .picked-author.mine {
      background: var(--olive);
      color: var(--paper-light);
    }

    /* 追蹤按鈕 */
    .follow-button {
      border: 2.5px solid var(--ink);
      border-radius: 14px 18px 13px 17px;
      padding: 6px 14px;
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      box-shadow: 2px 2px 0 var(--ink);
      transform: rotate(1deg);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }
    .follow-button:active {
      transform: rotate(1deg) translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .follow-button.following {
      background: var(--olive);
      color: var(--paper-light);
    }

    /* 我的紙條頁：顯示自己的綽號 */
    .my-nickname-block {
      margin: 18px 4px 0;
      display: grid;
      gap: 12px;
    }
    .my-nickname-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .my-nickname {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 22px;
      font-weight: 700;
      display: inline-block;
      padding: 6px 16px;
      background: var(--olive);
      color: var(--paper-light);
      border: 2.5px solid var(--ink);
      border-radius: 14px 18px 13px 16px;
      box-shadow: 2px 3px 0 var(--ink);
      transform: rotate(-1deg);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .my-nickname.tone-olive { background: var(--olive); color: var(--paper-light); }
    .my-nickname.tone-tomato { background: var(--tomato); color: var(--paper-light); }
    .my-nickname.tone-mustard { background: var(--mustard); color: var(--ink); }
    .my-nickname.tone-sky { background: var(--sky); color: var(--ink); }
    .my-nickname.tone-rose { background: var(--rose); color: var(--ink); }
    .my-nickname.tone-ink { background: var(--ink); color: var(--paper-light); }
    .my-nickname.editing {
      box-shadow: 3px 5px 0 var(--tomato);
    }
    .my-nickname-text {
      display: inline;
      outline: none;
      min-width: 1em;
    }
    .my-nickname-text[contenteditable="true"] {
      cursor: text;
      border-bottom: 2px dashed rgba(255, 248, 227, 0.85);
    }
    .my-nickname.tone-mustard .my-nickname-text[contenteditable="true"],
    .my-nickname.tone-sky .my-nickname-text[contenteditable="true"],
    .my-nickname.tone-rose .my-nickname-text[contenteditable="true"] {
      border-bottom-color: rgba(31, 24, 18, 0.35);
    }
    .nickname-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .nickname-action-button {
      border: 2.5px solid var(--ink);
      border-radius: 14px 18px 13px 17px;
      padding: 8px 16px;
      background: var(--mustard);
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      box-shadow: 2px 2px 0 var(--ink);
      min-height: 44px;
    }
    .nickname-action-button:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .nickname-action-button.primary {
      background: var(--tomato);
      color: var(--paper);
    }
    .nickname-action-button.secondary {
      background: var(--paper);
    }
    .nickname-hint {
      margin: 0;
      font-size: 13px;
    }

    .note-content {
      margin: 0;
      padding: 24px;
      border: 2.5px solid var(--ink);
      border-radius: 4px 12px 6px 10px;
      background: var(--paper-light);
      line-height: 2.0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overflow-x: hidden;
      max-width: 100%;
      box-sizing: border-box;
      font-size: 18px;
      color: var(--ink);
      font-family: "Caveat", "Patrick Hand", "Noto Sans TC", serif;
      box-shadow: var(--shadow-md);
      position: relative;
      /* 信紙橫線 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 30px,
        rgba(31, 24, 18, 0.1) 30px,
        rgba(31, 24, 18, 0.1) 31px
      );
      background-position: 0 18px;
      transform: rotate(-0.5deg);
    }
    /* 右下角小郵戳 */
    .note-content::after {
      content: "";
      position: absolute;
      bottom: 10px;
      right: 12px;
      width: 38px;
      height: 38px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='15' fill='none' stroke='%23d94f3d' stroke-width='2' stroke-dasharray='3 2'/><text x='20' y='25' font-size='14' font-family='serif' font-weight='bold' fill='%23d94f3d' text-anchor='middle'>私</text></svg>") no-repeat center / contain;
      transform: rotate(-12deg);
    }

    .note-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 0;
      padding: 14px 6px;
      border-top: 2.5px dashed var(--ink);
      border-bottom: 2.5px dashed var(--ink);
    }
    .note-meta dt {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.15em;
      font-weight: 700;
    }
    .note-meta dd {
      margin: 6px 0 0;
      color: var(--ink);
      font-weight: 700;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .reply-entry-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }
    .reply-entry-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: var(--paper);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .reply-list {
      display: grid;
      gap: 10px;
      max-height: 200px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .reply-list-full {
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }

    .reply-card {
      display: grid;
      gap: 6px;
      padding: 14px;
      border: 2.5px solid var(--ink);
      border-radius: 10px 14px 11px 12px;
      background: var(--paper);
      box-shadow: 2px 3px 0 var(--ink);
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .reply-list-full .reply-card {
      transform: none;
    }
    .reply-card p {
      margin: 0;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }
    .reply-card small {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .sticker-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .sticker-button {
      aspect-ratio: 1;
      border: 2.5px solid var(--ink);
      border-radius: 50% 48% 52% 50%;
      background: var(--paper);
      font-size: 26px;
      box-shadow: 2px 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .sticker-button:nth-child(odd) { transform: rotate(-3deg); }
    .sticker-button:nth-child(even) { transform: rotate(3deg); }
    .sticker-button:active {
      transform: translate(2px, 3px) rotate(0) !important;
      box-shadow: 0 0 0 var(--ink);
    }

    /* 撿紙條底部動作列 */
    .pick-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 2.5px dashed var(--ink);
    }
    .text-button {
      padding: 8px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.05em;
      text-decoration: underline;
      text-decoration-color: var(--muted);
      text-decoration-style: wavy;
      text-underline-offset: 4px;
      align-self: center;
    }
    .text-button:active { color: var(--tomato); }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    /* ========== 圖片預覽 ========== */
    .image-input-row {
      display: grid;
      gap: 10px;
    }
    .image-preview, .picked-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border: 2.5px solid var(--ink);
      border-radius: 6px 12px 7px 11px;
      background: var(--paper);
      box-shadow: var(--shadow-md);
      transform: rotate(-1deg);
    }

    /* ========== 城市搜尋結果 ========== */
    .result-row {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      border: 2.5px solid var(--ink);
      border-radius: 10px 14px 11px 12px;
      background: var(--paper);
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      font-size: 15px;
      font-family: inherit;
      box-shadow: 2px 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }
    .result-row:active {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 var(--ink);
    }

    /* ========== 我的紙條頁 ========== */
    .page {
      position: absolute;
      z-index: 900;
      inset: 0;
      display: none;
      padding: 20px;
      background: var(--paper);
      overflow: auto;
    }
    .page.open { display: block; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: env(safe-area-inset-top);
    }
    .page-header h1 {
      margin: 0;
      font-family: "Caveat", cursive;
      font-size: 38px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
      transform: rotate(-1deg);
      position: relative;
    }
    .page-header h1::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -8px;
      height: 8px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 8' preserveAspectRatio='none'><path d='M2,4 Q25,0 50,4 T98,4' stroke='%23e6a724' stroke-width='3' fill='none' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
    }

    .note-list {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .note-card {
      padding: 18px;
      border: 2.5px solid var(--ink);
      border-radius: 8px 14px 9px 12px;
      background: var(--paper-light);
      box-shadow: var(--shadow-md);
      transform: rotate(-0.5deg);
    }
    .note-card:nth-child(2n) { transform: rotate(0.6deg); }
    .note-card:nth-child(3n) { transform: rotate(-0.3deg); }
    .note-card p {
      margin: 0 0 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      font-size: 16px;
    }
    .note-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* ========== 附近紙條提示 ========== */
    .alert {
      position: absolute;
      z-index: 500;
      left: 50%;
      bottom: 168px;
      transform: translateX(-50%) rotate(-2deg);
      border: 2.5px solid var(--ink);
      border-radius: 24px 30px 26px 28px;
      padding: 12px 22px;
      color: var(--paper);
      background: var(--tomato);
      box-shadow: var(--shadow-md);
      display: none;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-size: 15px;
      font-family: inherit;
      animation: alertBounce 1.4s ease-in-out infinite;
    }
    .alert.show { display: block; }

    .alert.reply-alert {
      z-index: 860;
      pointer-events: auto;
      left: auto;
      right: 16px;
      bottom: 168px;
      transform: rotate(2deg);
      background: var(--mustard);
      color: var(--ink);
      max-width: calc(100% - 32px);
    }
    .alert.reply-alert.show {
      display: block;
    }
    @keyframes replyAlertBounce {
      0%, 100% { transform: translateY(0) rotate(2deg); }
      50%      { transform: translateY(-6px) rotate(2deg); }
    }
    .alert.reply-alert.show {
      animation: replyAlertBounce 1.4s ease-in-out infinite;
    }

    .bottom-tab {
      position: relative;
    }
    .bottom-tab .tab-badge {
      position: absolute;
      top: 2px;
      right: 8px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--tomato);
      color: var(--paper);
      font-size: 11px;
      font-weight: 900;
      line-height: 18px;
      text-align: center;
      border: 2px solid var(--paper);
      display: none;
    }
    .bottom-tab .tab-badge.show { display: block; }

    .image-preview-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .image-preview-row .image-preview {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--ink);
    }

    @keyframes alertBounce {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
      50%      { transform: translateX(-50%) translateY(-6px) rotate(-2deg); }
    }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      z-index: 1000;
      left: 50%;
      top: max(80px, calc(env(safe-area-inset-top) + 70px));
      max-width: min(520px, calc(100% - 28px));
      transform: translateX(-50%) rotate(-1deg);
      border: 2.5px solid var(--ink);
      border-radius: 16px 20px 17px 19px;
      padding: 12px 22px;
      color: var(--paper);
      background: var(--ink);
      box-shadow: 3px 4px 0 var(--mustard);
      display: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
    }
    .toast.show {
      display: block;
      animation: toastIn 0.3s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-12px) rotate(-1deg); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) rotate(-1deg); }
    }

    /* ========== 自製對話框（取代 alert/confirm） ========== */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(31, 24, 18, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: dialogFadeIn 0.2s ease-out;
    }
    .dialog-backdrop.show { display: flex; }

    @keyframes dialogFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .dialog-box {
      background: var(--paper-light);
      border: 3px solid var(--ink);
      border-radius: 18px 22px 19px 21px;
      box-shadow: var(--shadow-lg);
      padding: 24px 22px 22px;
      max-width: 360px;
      width: 100%;
      transform: rotate(-1deg);
      animation: dialogPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes dialogPopIn {
      from { opacity: 0; transform: rotate(-1deg) scale(0.85); }
      to   { opacity: 1; transform: rotate(-1deg) scale(1); }
    }

    .dialog-message {
      margin: 0 0 22px;
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      font-weight: 700;
      white-space: pre-wrap;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .dialog-actions .primary-button,
    .dialog-actions .secondary-button {
      min-width: 88px;
      min-height: 42px;
      padding: 0 18px;
      font-size: 15px;
    }

    @media (max-width: 380px) {
      .note-meta { grid-template-columns: 1fr 1fr; }
      .bottom-tab.left { padding-left: 18px; }
      .bottom-tab.right { padding-right: 18px; }
      .throw-paper-ball { width: 104px; height: 104px; }
      .throw-ball-remaining { font-size: 10px; bottom: 26%; }
    }
  </style>
</head>

<body class="is-booting">
  <!-- ============= 開場動畫（首頁載入完成後自動關閉） ============= -->
  <div class="splash" id="splash" aria-hidden="false">
    <div class="splash-scene" aria-hidden="true">
      <!-- 信鴿叼著紙條飛過 -->

        })
      ]);

      replyList: document.querySelector("#replyList"),
      replyForm: document.querySelector("#replyForm"),
      replyInput: document.querySelector("#replyInput"),
      replyCountText: document.querySelector("#replyCountText"),
      submitReplyButton: document.querySelector("#submitReplyButton"),
      stickerRow: document.querySelector("#stickerRow"),
      shareNoteButton: document.querySelector("#shareNoteButton"),
      reportNoteButton: document.querySelector("#reportNoteButton"),
      nearbyAlert: document.querySelector("#nearbyAlert"),
      replyAlert: document.querySelector("#replyAlert"),
      myNotesBadge: document.querySelector("#myNotesBadge"),
      myNotesTitle: document.querySelector("#myNotesTitle"),
      myNotesButton: document.querySelector("#myNotesButton"),
      myNotesPage: document.querySelector("#myNotesPage"),
      myNotesList: document.querySelector("#myNotesList"),
      myNickname: document.querySelector("#myNickname"),
      myNicknameText: document.querySelector("#myNicknameText"),
      rollNicknameButton: document.querySelector("#rollNicknameButton"),
      editNicknameButton: document.querySelector("#editNicknameButton"),
      confirmNicknameButton: document.querySelector("#confirmNicknameButton"),
      cancelNicknameButton: document.querySelector("#cancelNicknameButton"),
      cityForm: document.querySelector("#cityForm"),
      cityInput: document.querySelector("#cityInput"),
      cityResults: document.querySelector("#cityResults"),
      toast: document.querySelector("#toast")
    };

    const map = L.map("map", { zoomControl: false }).setView([taipei.lat, taipei.lng], 15);

    /*
      地圖瓦片來源策略：依序嘗試
      1. OSM 國際版（最穩定、線條簡單、全球可用，預設）
      2. NLSC 國土測繪中心（台灣官方圖資、街道全中文）
      3. OSM 台灣中文版（社群維護）

      改變策略原因：在 LINE WebView 內 NLSC 容易被擋（CORS 限制），
      OSM 國際版是業界標準，幾乎不會失敗。
    */
    const TILE_SOURCES = [
      {
        name: "OSM-World",
        url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        attribution: "&copy; OpenStreetMap",
        maxZoom: 19
      },
      {
        name: "NLSC",
        url: "https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}",
        attribution: "&copy; 國土測繪中心",
        maxZoom: 18
      },
      {
        name: "OSM-TW",
        url: "https://tile.openstreetmap.tw/tiles/{z}/{x}/{y}.png",
        attribution: "&copy; OSM Taiwan",
        maxZoom: 19
      }
    ];

    let currentTileLayer = null;
    let currentTileIndex = 0;
    let bootTileResolve = null;
    const bootTileReady = new Promise((resolve) => {
      bootTileResolve = resolve;
    });

    function resolveBootTile() {
      if (!bootTileResolve) return;
      bootTileResolve();
      bootTileResolve = null;
    }

    function tryTileSource(index) {
      if (index >= TILE_SOURCES.length) {
        console.error("[圖磚] 所有來源都失敗，請檢查網路");
        showToast("地圖載入失敗，請檢查網路");
        resolveBootTile();
        return;
      }
      const src = TILE_SOURCES[index];
      console.log(`[圖磚] 嘗試 ${src.name}：${src.url}`);

      if (currentTileLayer) {
        map.removeLayer(currentTileLayer);
      }

      const layer = L.tileLayer(src.url, {
        maxZoom: src.maxZoom || 19,
        attribution: src.attribution
      });

      let errorCount = 0;
      let firstTileLoaded = false;
      let timeoutId = null;

      layer.on("tileerror", (e) => {
        errorCount++;
        console.warn(`[圖磚] ${src.name} 錯誤 #${errorCount}`, e?.tile?.src || "");
        if (!firstTileLoaded && errorCount >= 3) {
          console.warn(`[圖磚] ${src.name} 失敗，切換下一個`);
          clearTimeout(timeoutId);
          tryTileSource(index + 1);
        }
      });

      layer.on("tileload", () => {
        if (!firstTileLoaded) {
          console.log(`[圖磚] ${src.name} 載入成功 ✓`);
          firstTileLoaded = true;
          clearTimeout(timeoutId);
          resolveBootTile();
        }
      });

      layer.addTo(map);
      currentTileLayer = layer;
      currentTileIndex = index;

      // 3 秒內沒有任何瓦片載入成功，直接切下一個
      timeoutId = setTimeout(() => {
        if (!firstTileLoaded) {
          console.warn(`[圖磚] ${src.name} 3 秒沒回應，切換下一個`);
          tryTileSource(index + 1);
        }
      }, 3000);
    }

    tryTileSource(0);

    // 開場動畫結束後強制重新計算地圖尺寸
    // 為什麼這樣做：splash 動畫期間 z-index 9999 蓋著畫面，Leaflet 可能拿到
    // 錯的容器尺寸；動畫結束時 invalidateSize() 強迫它重算。
    const splashEl = document.querySelector("#splash");

    function fixMapSize(label) {
      map.invalidateSize();
      console.log(`[地圖] invalidateSize 觸發 (${label})`);
    }

    function dismissSplash() {
      splashEl?.classList.add("ready");
      splashEl?.setAttribute("aria-hidden", "true");
      document.body.classList.remove("is-booting");
      setTimeout(() => {
        if (splashEl?.classList.contains("ready")) {
          splashEl.style.display = "none";
        }
        fixMapSize("splash-dismiss");
      }, 450);
    }

    if (splashEl) {
      splashEl.addEventListener("animationend", (event) => {
        if (event.target === splashEl) fixMapSize("animationend");
      });
    }

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve();
        img.onerror = reject;
        img.src = src;
      });
    }

    function getDailyUsage() {
      const today = new Date().toISOString().slice(0, 10);
      const raw = JSON.parse(localStorage.getItem(`jzt_daily_usage_${currentUserId}`) || "{}");
      if (raw.date !== today) {
        return { date: today, throwCount: 0, imageCount: 0 };
      }
      return {
        date: today,
        throwCount: raw.throwCount ?? raw.count ?? 0,
        imageCount: raw.imageCount ?? 0
      };
    }

    function saveDailyUsage(usage) {
      localStorage.setItem(`jzt_daily_usage_${currentUserId}`, JSON.stringify(usage));
    }

    function getTodayThrowCount() {
      return getDailyUsage().throwCount;
    }

    function getTodayImageCount() {
      return getDailyUsage().imageCount;
    }

    function getNoteImageUrls(note) {
      if (Array.isArray(note.imageUrls) && note.imageUrls.length) {
        return note.imageUrls.filter(Boolean).slice(0, MAX_IMAGES_PER_NOTE);
      }
      if (note.imageUrl) return [note.imageUrl];
      return [];
    }

    function getNoteActivityTime(note) {
      return note.lastActivityAt || note.lastDriftAt || note.createdAt;
    }

    /** 有回覆或後續互動才顯示更新時間（丟出當下不算更新） */
    function getNoteUpdatedTime(note) {
      if (!note?.lastActivityAt) return null;
      if ((note.replyCount || 0) > 0) return note.lastActivityAt;
      const created = new Date(note.createdAt).getTime();
      const updated = new Date(note.lastActivityAt).getTime();
      if (!Number.isFinite(created) || !Number.isFinite(updated)) return null;
      return updated - created > 60000 ? note.lastActivityAt : null;
    }

    function formatNoteTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("zh-TW", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatNoteTimesMeta(note) {
      const created = formatNoteTime(note.createdAt);
      const updatedTime = getNoteUpdatedTime(note);
      if (!updatedTime) return `丟出 ${created}`;
      return `丟出 ${created} · 更新 ${formatNoteTime(updatedTime)}`;
    }

    function updatePickedTimes(note) {
      els.pickedCreatedTime.textContent = formatNoteTime(note.createdAt);
      const updatedTime = getNoteUpdatedTime(note);
      els.pickedUpdatedTime.textContent = updatedTime ? formatNoteTime(updatedTime) : "尚未有更新";
    }

    function sortNotesByActivity(noteList) {
      return [...noteList]
        .sort((a, b) => new Date(getNoteActivityTime(b)) - new Date(getNoteActivityTime(a)))
        .slice(0, MAP_NOTE_LIMIT);
    }

    function normalizeNote(note) {
      if (!note?.id) return null;
      const raw = note.location;
      if (!raw) return null;
      const lat = Number(raw.lat ?? raw.latitude);
      const lng = Number(raw.lng ?? raw.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      return {
        ...note,
        location: { lat, lng }
      };
    }

    function normalizeNotes(list) {
      return list.map(normalizeNote).filter(Boolean);
    }

    function resolveNote(noteOrId) {
      if (!noteOrId) return null;
      const id = typeof noteOrId === "string" ? noteOrId : noteOrId.id;
      if (!id) return null;
      return notes.find((item) => item.id === id) || (typeof noteOrId === "object" ? noteOrId : null);
    }

    function escapeHtmlAttr(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function mapFirestoreDoc(doc) {
      const data = doc.data();
      if (!data) return null;
      const imageUrls = Array.isArray(data.imageUrls) && data.imageUrls.length
        ? data.imageUrls.filter(Boolean).slice(0, MAX_IMAGES_PER_NOTE)
        : (data.imageUrl ? [data.imageUrl] : []);
      const createdAt = data.createdAt?.toDate?.().toISOString() || new Date().toISOString();
      const lastActivityAt = data.lastActivityAt?.toDate?.().toISOString() || null;
      const lastDriftAt = data.lastDriftAt?.toDate?.().toISOString() || null;
      const loc = data.location;
      let lat;
      let lng;
      if (loc && typeof loc.latitude === "number") {
        lat = loc.latitude;
        lng = loc.longitude;
      } else if (loc) {
        lat = loc.lat ?? loc.latitude;
        lng = loc.lng ?? loc.longitude;
      }
      return normalizeNote({
        id: doc.id,
        authorUid: data.authorUid,
        authorNickname: data.authorNickname || "",
        type: data.type,
        content: data.content,
        imageUrl: imageUrls[0] || "",
        imageUrls,
        location: { lat, lng },
        city: data.city,
        createdAt,
        lastActivityAt,
        lastDriftAt,
        expiresAt: data.expiresAt?.toDate?.().toISOString() || addDays(new Date(), 30).toISOString(),
        pickedCount: data.pickedCount || 0,
        replyCount: data.replyCount || 0,
        reportCount: data.reportCount || 0,
        isSeed: Boolean(data.isSeed)
      });
    }

    /** Firebase 為唯一真相來源：收到資料就直接更新地圖 */
    function setNotesFromFirestoreDocs(docs) {
      const all = docs.map(mapFirestoreDoc).filter(Boolean);
      if (docs.length > 0 && !all.length) {
        console.error("[紙條] 有資料但無法解析 location，請檢查 notes 文件");
      }
      const filtered = all.filter((item) => (item.reportCount || 0) < 3 || isMyNote(item));
      notes = sortNotesByActivity(filtered);
      filtered.forEach((note) => {
        if (isMyNote(note)) registerAuthorUid(note.authorUid);
      });
      if (notes.length) saveNotesCache();
      renderNotes();
      updateReplyAlert();
      enrichNotesWithPickCounts(notes).then((changed) => {
        if (!changed) return;
        saveNotesCache();
        renderNotes();
        if (selectedNote) {
          const fresh = notes.find((item) => item.id === selectedNote.id);
          if (fresh) {
            selectedNote.pickedCount = fresh.pickedCount;
            if (els.pickedCount) els.pickedCount.textContent = `${fresh.pickedCount || 0} 次`;
          }
        }
      });
    }

    async function enrichNotesWithPickCounts(notesList) {
      if (!hasFirebase || !notesList.length) return false;
      const counts = await loadPickCountsByNoteId();
      if (!Object.keys(counts).length) return false;
      let changed = false;
      notesList.forEach((note) => {
        const fromPicks = counts[note.id];
        if (fromPicks == null) return;
        const next = Math.max(note.pickedCount || 0, fromPicks);
        if (next !== (note.pickedCount || 0)) {
          note.pickedCount = next;
          changed = true;
        }
      });
      return changed;
    }

    function buildNotesQuery() {
      // 不用 orderBy：舊紙條可能只有 lastDriftAt、沒有 lastActivityAt，
      // 用 orderBy 會漏掉整批資料。排序改在前端 sortNotesByActivity。
      const { collection, query, limit } = firebaseApi.firestoreModule;
      return query(collection(db, "notes"), limit(MAP_NOTE_LIMIT));
    }

    function stopNotesListener() {
      notesListenerToken++;
      if (notesUnsubscribe) {
        notesUnsubscribe();
        notesUnsubscribe = null;
      }
    }

    async function startNotesListener() {
      if (!hasFirebase || !db) return;
      stopNotesListener();
      const token = notesListenerToken;

      await ensureAuth();
      if (token !== notesListenerToken) return;

      const { onSnapshot } = firebaseApi.firestoreModule;
      const q = buildNotesQuery();

      notesUnsubscribe = onSnapshot(
        q,
        (snapshot) => {
          if (token !== notesListenerToken) return;
          console.log(`[紙條] 即時更新 ${snapshot.docs.length} 筆`);
          setNotesFromFirestoreDocs(snapshot.docs);
        },
        (err) => {
          if (token !== notesListenerToken) return;
          console.error("[紙條] 監聽失敗", err);
          fetchNotesOnce().catch(() => {
            showToast("無法讀取紙條，請檢查 Firebase 規則");
          });
        }
      );
    }

    async function fetchNotesOnce() {
      if (!hasFirebase) return;
      await ensureAuth();
      try {
        const loaded = await loadFirebaseNotes();
        if (loaded.length > 0) {
          notes = loaded;
          saveNotesCache();
        } else if (!notes.length) {
          applyNotesCache();
        }
      } catch (error) {
        console.error("[紙條] 單次載入失敗", error);
        if (!notes.length) applyNotesCache();
      }
      renderNotes();
      updateReplyAlert();
    }

    async function ensureNotesLoaded() {
      if (notes.length) return;
      if (applyNotesCache() && notes.length) {
        renderNotes();
      }
      if (!hasFirebase) {
        notes = normalizeNotes(loadDemoNotes());
        if (!notes.length) {
          notes = normalizeNotes([...seedNotes(currentLocation, currentCity), ...notes]);
        }
        if (notes.length) renderNotes();
        return;
      }
      if (!notes.length) {
        await fetchNotesOnce();
      }
      if (!notesUnsubscribe) {
        await startNotesListener();
      }
    }

    function noteHasImage(note) {
      return getNoteImageUrls(note).length > 0;
    }

    function getSeenReplyCounts() {
      try {
        return JSON.parse(localStorage.getItem(`jzt_seen_replies_${currentUserId}`) || "{}");
      } catch {
        return {};
      }
    }

    function markNoteRepliesSeen(noteId, count) {
      const seen = getSeenReplyCounts();
      seen[noteId] = count;
      localStorage.setItem(`jzt_seen_replies_${currentUserId}`, JSON.stringify(seen));
    }

    function countNewReplies() {
      const seen = getSeenReplyCounts();
      return notes
        .filter((note) => isMyNote(note) && !note.isSeed)
        .reduce((sum, note) => {
          const current = note.replyCount || 0;
          const known = seen[note.id] || 0;
          return sum + Math.max(0, current - known);
        }, 0);
    }

    function updateReplyAlert() {
      const newCount = countNewReplies();
      if (newCount > 0) {
        els.replyAlert.hidden = false;
        els.replyAlert.classList.add("show");
        els.replyAlert.textContent = `有 ${newCount} 則新回覆，點我查看`;
        els.myNotesBadge.textContent = String(newCount);
        els.myNotesBadge.classList.add("show");
      } else {
        els.replyAlert.classList.remove("show");
        els.replyAlert.hidden = true;
        els.myNotesBadge.classList.remove("show");
      }
    }

    function updateThrowRemainingLabel() {
      const usage = getDailyUsage();
      const throwRemaining = Math.max(0, DAILY_LIMIT - usage.throwCount);
      const imageRemaining = Math.max(0, DAILY_IMAGE_LIMIT - usage.imageCount);
      els.throwRemainingText.textContent = `今日剩 ${throwRemaining} 次`;
      if (els.imageCountText) {
        els.imageCountText.textContent =
          `每張紙條 1 張圖 · 今日圖片剩 ${imageRemaining} 張`;
      }
      els.openThrowButton.setAttribute(
        "aria-label",
        throwRemaining > 0 ? `丟紙條，今日剩 ${throwRemaining} 次` : "今日次數已用完"
      );
    }

    function renderInitialNotes() {
      if (!markersLayer) return;
      notes = loadDemoNotes();
      els.cityText.textContent = currentCity;
      if (!hasFirebase && notes.length === 0) {
        notes = [...seedNotes(currentLocation, currentCity), ...notes];
      }
      renderNotes();
    }

    let bootFinished = false;
    let finishBootRef = null;

    window.__jztDismissBoot = (reason) => {
      if (finishBootRef) finishBootRef(reason || "fallback");
    };

    async function revealApp() {
      const bootStart = performance.now();
      const hardCapTimer = setTimeout(() => finishBoot("hard-cap"), 5000);

      async function finishBoot(reason) {
        if (bootFinished) return;
        bootFinished = true;
        finishBootRef = null;
        clearTimeout(hardCapTimer);
        console.log(`[開場] 關閉載入畫面 (${reason})`);

        try {
          updateThrowRemainingLabel();
          if (markersLayer) {
            if (!notes.length) applyNotesCache();
            renderNotes();
          }
          updateReplyAlert();
          map.invalidateSize();
        } catch (err) {
          console.warn("[開場] 初始畫面失敗", err);
        }

        dismissSplash();

        syncPickedNotesFromFirebase().catch((err) => console.warn("[背景] 撿記錄同步失敗", err));
        locateMe().catch((err) => console.warn("[背景] 定位失敗", err));
      }

      finishBootRef = finishBoot;

      loadPickedNotesLocal();

      try {
        await withTimeout(
          Promise.all([initLiff(), initFirebase()]),
          8000,
          "登入初始化逾時"
        ).catch((err) => console.warn("[開場] LIFF/Firebase 逾時，先用快取", err));

        applyAuthIdentity();
        loadPickedNotesLocal();
        applyNotesCache();
        renderNotes();

        if (hasFirebase) {
          await fetchNotesOnce().catch((err) =>
            console.warn("[開場] 首次載入失敗，先用快取", err)
          );
        }

        await Promise.race([
          Promise.all([
            Promise.race([document.fonts?.ready ?? Promise.resolve(), delay(400)]),
            Promise.race([preloadImage("paper_ball.png"), delay(600)]).catch(() => {}),
            Promise.race([bootTileReady, delay(2500)]),
            hasFirebase
              ? startNotesListener().catch((err) =>
                  console.warn("[開場] 即時監聽失敗", err)
                )
              : Promise.resolve(renderInitialNotes())
          ]),
          delay(8000)
        ]);
      } catch (err) {
        console.warn("[開場] 資源等待失敗", err);
      } finally {
        const elapsed = performance.now() - bootStart;
        if (elapsed < MIN_SPLASH_MS) {
          await delay(MIN_SPLASH_MS - elapsed);
        }
        await finishBoot("ready");
      }
    }

    markersLayer = L.layerGroup().addTo(map);
    userMarker = L.marker([currentLocation.lat, currentLocation.lng], {
      icon: L.divIcon({
        className: "",
        html: '<div class="user-marker"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      })
    }).addTo(map);
    map.setView([currentLocation.lat, currentLocation.lng], 15);
    els.cityText.textContent = currentCity;

    // 重新整理時先顯示快取紙條，Firebase 載完再更新
    loadPickedNotesLocal();
    if (hasFirebase && applyNotesCache()) {
      renderNotes();
    }

    revealApp();

    window.addEventListener("resize", () => fixMapSize("resize"));

    els.cityButton.addEventListener("click", () => openSheet("city"));
    els.locateButton.addEventListener("click", locateMe);
    els.refreshButton.addEventListener("click", async () => {
      els.refreshButton.style.transform = "rotate(360deg)";
      els.refreshButton.style.transition = "transform 0.6s ease";
      await refreshNotes();
      setTimeout(() => {
        els.refreshButton.style.transform = "";
        els.refreshButton.style.transition = "";
      }, 600);
      showToast("已重新整理");
    });
    els.openThrowButton.addEventListener("click", () => openSheet("throw"));
    els.myNotesButton.addEventListener("click", () => showMyNotes({ repliesOnly: false }));
    els.rollNicknameButton.addEventListener("click", () => rollMyNickname());
    els.editNicknameButton.addEventListener("click", () => enterNicknameEdit());
    els.confirmNicknameButton.addEventListener("click", () => confirmNicknameEdit());
    els.cancelNicknameButton.addEventListener("click", () => cancelNicknameEdit());
    els.myNicknameText.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        confirmNicknameEdit();
      } else if (event.key === "Escape") {
        event.preventDefault();
        cancelNicknameEdit();
      }
    });
    els.myNicknameText.addEventListener("input", () => {
      if (!nicknameEditing || !els.myNicknameText) return;
      const text = els.myNicknameText.textContent || "";
      if (text.length > 24) {
        els.myNicknameText.textContent = text.slice(0, 24);
        placeCaretAtEnd(els.myNicknameText);
      }
    });
    els.replyAlert.addEventListener("click", () => showMyNotes({ repliesOnly: true }));
    els.openRepliesButton.addEventListener("click", () => openRepliesSheet());
    els.pickBackButton.addEventListener("click", () => returnFromPickSheet());
    els.replyBackButton.addEventListener("click", () => {
      closeReplyComposeDrawer();
      if (selectedNote) openSheet("pick");
      else closeSheets();
    });
    els.openReplyComposeButton.addEventListener("click", () => openReplyComposeDrawer());
    els.closeReplyComposeButton.addEventListener("click", () => closeReplyComposeDrawer());
    els.replyComposeBackdrop.addEventListener("click", () => closeReplyComposeDrawer());
    els.nearbyListButton.addEventListener("click", showNearbyList);
    els.nearbyAlert.addEventListener("click", pickNearestNote);
    els.replyInput.addEventListener("input", () => {
      const left = 140 - els.replyInput.value.length;
      els.replyCountText.textContent = `${left} 字`;
      updateReplySubmitState();
    });
    els.replyInput.addEventListener("compositionend", updateReplySubmitState);
    els.replyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = els.replyInput.value.trim().slice(0, 140);
      if (!content || !selectedNote || replyingInProgress) return;
      await submitReply({ type: "text", content });
      els.replyInput.value = "";
      els.replyCountText.textContent = "140 字";
      updateReplySubmitState();
      closeReplyComposeDrawer();
    });
    function insertIntoReplyInput(text) {
      const input = els.replyInput;
      if (!input || !text) return;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const combined = (input.value.slice(0, start) + text + input.value.slice(end)).slice(0, 140);
      input.value = combined;
      const cursor = Math.min(start + text.length, combined.length);
      input.setSelectionRange(cursor, cursor);
      input.focus();
      els.replyCountText.textContent = `${140 - combined.length} 字`;
      updateReplySubmitState();
    }
    function handleStickerPick(event) {

    els.throwForm.addEventListener("submit", async (event) => {

      if (usage.throwCount >= DAILY_LIMIT) {
        showToast(`今天已經扔 ${DAILY_LIMIT} 張了，明天再來吧`);
        return;
      }

      const imageRemaining = DAILY_IMAGE_LIMIT - usage.imageCount;
      if (imageFile && imageRemaining <= 0) {
        showToast(`今天圖片只剩 ${imageRemaining} 張額度`);
        return;
      }

      const nowIso = new Date().toISOString();
      const note = {
        id: crypto.randomUUID(),
        authorUid: currentUserId,
        authorNickname: getMyNickname(),
        type: imageFile ? "image" : "text",
        content,
        imageUrl: "",
        imageUrls: [],
        location: { ...currentLocation },
        city: currentCity,
        createdAt: nowIso,
        lastActivityAt: nowIso,
        expiresAt: addDays(new Date(), 30).toISOString(),
        pickedCount: 0,
        replyCount: 0,
        isSeed: false
      };

      try {
        els.submitNoteButton.disabled = true;

          note.imageUrl = url;

        els.noteInput.value = "";
        clearThrowImages();
        els.countText.textContent = "140 字";

        renderNotes();
        updateReplyAlert();

    function resetSheetVisual(sheet) {

    }

    }

    function getSheetScrollEl(sheet) {
      if (sheet === "nearby") return els.nearbySheet;
      if (sheet === "myNotes") return els.myNotesPage;
      return null;
    }

    function setPickReturnContext(sheet) {
      const scrollEl = getSheetScrollEl(sheet);
      sheetReturnContext = {
        sheet,
        scrollTop: scrollEl?.scrollTop || 0
      };
      updatePickBackButton();
    }

    function clearPickReturnContext() {
      sheetReturnContext = null;
      updatePickBackButton();
    }

    function updatePickBackButton() {
      if (!els.pickBackButton) return;
      const sheet = sheetReturnContext?.sheet;
      els.pickBackButton.hidden = !sheet;
      const header = els.pickSheet?.querySelector(".sheet-header");
      header?.classList.toggle("sheet-header-with-back", Boolean(sheet));
      if (sheet === "nearby") {
        els.pickBackButton.setAttribute("aria-label", "返回附近列表");
      } else if (sheet === "myNotes") {
        els.pickBackButton.setAttribute("aria-label", "返回我的紙條");
      }
    }

    function returnFromPickSheet() {
      closeReplyComposeDrawer();
      const ctx = sheetReturnContext;
      if (!ctx?.sheet) {
        closeSheets();
        return;
      }
      const { sheet, scrollTop } = ctx;
      openSheet(sheet);
      const scrollEl = getSheetScrollEl(sheet);
      if (scrollEl) {
        requestAnimationFrame(() => {
          scrollEl.scrollTop = scrollTop;

    function closeReplyComposeDrawer() {

      els.replyComposeDrawer.classList.remove("open");
      els.replyComposeDrawer.setAttribute("aria-hidden", "true");
      if (els.replyComposeBackdrop) {
        els.replyComposeBackdrop.classList.remove("show");

        stopRepliesListener();
        clearPickReturnContext();
      }
      const keep = typeof except === "string" ? except : null;
      if (keep !== "throw") els.throwSheet.classList.remove("open");
      if (keep !== "pick") els.pickSheet.classList.remove("open");
      if (keep !== "city") els.citySheet.classList.remove("open");

      [els.throwSheet, els.pickSheet, els.citySheet, els.nearbySheet, els.myNotesPage, els.replySheet]
        .forEach(resetSheetVisual);

      if (name === "pick") els.pickSheet.classList.add("open");
      if (name === "city") els.citySheet.classList.add("open");
      if (name === "nearby") els.nearbySheet.classList.add("open");

    /*
      抽屜手勢：往下滑可關閉
      只在標題列範圍內偵測，避免內容滾動衝突
    */
    function attachSwipeDownToClose(sheet) {
      const header = sheet.querySelector(".sheet-header");
      if (!header) return;

      let startY = 0;
      let currentY = 0;
      let dragging = false;

      header.addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
        currentY = startY;
        dragging = true;
      }, { passive: true });

      header.addEventListener("touchmove", (e) => {
        if (!dragging) return;
        currentY = e.touches[0].clientY;
        const dy = currentY - startY;
        if (dy > 0) {
          sheet.classList.add("dragging");
          sheet.style.transform = `translateY(${dy}px)`;
        }
      }, { passive: true });

      header.addEventListener("touchend", () => {
        if (!dragging) return;
        dragging = false;
        const dy = currentY - startY;
        sheet.classList.remove("dragging");
        sheet.style.transform = "";
        // 拖超過 80px 就視為關閉
        if (dy > 80) {
          closeSheets();
        }
      });
    }

    // 對所有抽屜啟用滑動關閉
    document.querySelectorAll(".sheet").forEach(attachSwipeDownToClose);

    /*
      ============= 地圖篩選器 =============
      currentFilter: "all" | "following" | "mine"
      切換後立即重畫 marker
    */
    document.querySelectorAll(".filter-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderNotes();
      });
    });

    function applyFilter(noteList) {
      if (currentFilter === "all") return noteList;
      if (currentFilter === "mine") {
        return noteList.filter((n) => isMyNote(n));
      }
      if (currentFilter === "following") {
        const followed = getFollowedUids();
        return noteList.filter((n) => followed.has(n.authorUid) || isMyNote(n));
      }
      return noteList;
    }

    function showNearbyList() {
      openSheet("nearby");
      els.nearbyList.innerHTML = '<p class="muted">載入中…</p>';

      ensureNotesLoaded().then(() => {
        const sorted = applyFilter(notes)
        .map((note) => ({ note, distance: distanceMeters(currentLocation, note.location) }))
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 50);

      els.nearbyList.innerHTML = "";
      if (sorted.length === 0) {
        els.nearbyList.innerHTML = '<p class="muted">全台還沒有紙條。</p>';
      } else {
        sorted.forEach(({ note, distance }) => {
          const isMine = isMyNote(note);
          const card = document.createElement("article");
          card.className = "note-card";
          card.style.cursor = "pointer";

          if (noteHasImage(note)) {
            appendNoteImages(card, note);
          }

          const p = document.createElement("p");
          p.textContent = note.content || "圖片紙條";
          card.appendChild(p);

          const meta = document.createElement("span");
          meta.className = "muted";
          const distText = distance < 1000 ? `${Math.round(distance)} 公尺` : `${(distance / 1000).toFixed(1)} 公里`;
          meta.textContent = `${isMine ? "📜 我的" : "📃 " + nicknameOf(note.authorUid, note)} · ${note.city || "—"} · ${distText} · 被撿起 ${note.pickedCount} 次 · ${formatNoteTimesMeta(note)}`;
          card.appendChild(meta);

          card.addEventListener("click", () => {
            setPickReturnContext("nearby");
            pickNote(note);
          });
          els.nearbyList.appendChild(card);
        });
      }
      });
    }

    function locateMe(options = {}) {
      els.locateText.textContent = "定位中";
      els.locateButton.classList.add("locating");

      return new Promise((resolve) => {
        const finish = async () => {
          try {
            els.cityText.textContent = currentCity;
            saveLastLocation();
            // 紙條是全台顯示，定位只需重畫地圖與附近提示，不必重抓 Firebase
            renderNotes();
          } finally {
            els.locateText.textContent = "重新定位";
            els.locateButton.classList.remove("locating");
            resolve();
          }
        };

        if (!navigator.geolocation) {
          showToast("這個瀏覽器不支援定位，先用台北測試");
          finish();
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            currentLocation = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };
            currentCity = await reverseCity(currentLocation);
            map.setView([currentLocation.lat, currentLocation.lng], 15);
            userMarker.setLatLng([currentLocation.lat, currentLocation.lng]);
            await finish();
          },
          async () => {
            showToast("無法取得定位，先用台北測試");
            await finish();
          },
          { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
        );
      });
    }

    async function refreshNotes() {
      if (!hasFirebase) {
        notes = normalizeNotes(loadDemoNotes());
        if (!notes.length) {
          notes = normalizeNotes([...seedNotes(currentLocation, currentCity), ...notes]);
        }
        renderNotes();
        updateReplyAlert();
        return;
      }
      await fetchNotesOnce();
      if (!notesUnsubscribe) {
        await startNotesListener();
      }
    }

    function getNearbyUnpickedNotes() {
      return normalizeNotes(applyFilter(notes)).filter((note) =>
        !isMyNote(note) &&
        !hasPickedNoteBefore(note.id) &&
        distanceMeters(currentLocation, note.location) <= NEARBY_RADIUS_METERS
      );
    }

    function updateNearbyAlert() {
      const nearby = getNearbyUnpickedNotes();
      if (nearby.length > 0) {
        els.nearbyAlert.textContent = nearby.length === 1
          ? "附近有一張紙條，點我撿起"
          : `附近有 ${nearby.length} 張紙條，點我撿起`;
        els.nearbyAlert.classList.add("show");
      } else {
        els.nearbyAlert.classList.remove("show");
      }
    }

    function renderNotes() {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      const visibleNotes = normalizeNotes(applyFilter(notes));

      visibleNotes.forEach((note) => {
        try {
          const isMine = isMyNote(note);
          const isFollowed = isFollowing(note.authorUid);
          const hasImage = noteHasImage(note);

          let extraClass = "";
          if (isMine) extraClass = "mine";
          else if (isFollowed) extraClass = "followed";

          let markerHtml;
          let iconSize;
          if (hasImage) {
            const thumbUrl = escapeHtmlAttr(getNoteImageUrls(note)[0]);
            markerHtml = `<div class="paper-marker image-marker ${extraClass}"><img src="${thumbUrl}" alt="" loading="lazy" /></div>`;
            iconSize = 44;
          } else {
            let emoji = "📃";
            if (isMine) emoji = "📜";
            else if (isFollowed) emoji = "📨";
            markerHtml = `<div class="paper-marker ${extraClass}">${emoji}</div>`;
            iconSize = 36;
          }

          const marker = L.marker([note.location.lat, note.location.lng], {
            title: note.content || "圖片紙條",
            icon: L.divIcon({
              className: "",
              html: markerHtml,
              iconSize: [iconSize, iconSize],
              iconAnchor: [iconSize / 2, iconSize / 2]
            })
          });

          marker.on("click", () => {
            clearPickReturnContext();
            pickNote(note);
          });
          marker.addTo(markersLayer);
        } catch (err) {
          console.warn("[地圖] 略過無法顯示的紙條", note?.id, err);
        }
      });

      updateNearbyAlert();
    }

    function pickNearestNote() {
      clearPickReturnContext();
      const nearest = notes
        .filter((note) => !isMyNote(note) && !hasPickedNoteBefore(note.id))
        .map((note) => ({
          note,
          distance: distanceMeters(currentLocation, note.location)
        }))
        .filter((item) => item.distance <= NEARBY_RADIUS_METERS)
        .sort((a, b) => a.distance - b.distance)[0];

      if (!nearest) {
        showToast("附近暫時沒有紙條");
        return;
      }

      pickNote(nearest.note);
    }

    async function pickNote(noteOrId) {
      const note = normalizeNote(resolveNote(noteOrId));
      if (!note) {
        showToast("找不到這張紙條");
        return;
      }

      selectedNote = note;
      const isOwn = isMyNote(note);

      openSheet("pick");
      updatePickBackButton();
      renderPickedNote(note);
      els.pickedAuthor.textContent = isOwn ? `來自我（${nicknameOf(note.authorUid, note)}）` : `來自 ${nicknameOf(note.authorUid, note)}`;
      els.pickedAuthor.classList.toggle("mine", isOwn);

      const canFollow = !isOwn && note.authorUid !== "seed";
      els.followButton.hidden = !canFollow;
      if (canFollow) {
        updateFollowButtonUI(note.authorUid);
      }

      els.pickedCity.textContent = note.city;
      els.pickedCount.textContent = "…";
      updatePickedTimes(note);
      selectedReplies = [];
      updateReplyEntryCount();
      updateReplySubmitState();
      void startRepliesListener(note);

      try {
        const count = await (async () => {
          if (!isOwn && note.authorUid !== "seed") {
            try {
              await recordNotePick(note);
            } catch (err) {
              console.error("[撿紙條] 次數更新失敗", err);
            }
          }
          return syncPickCount(note);
        })();
        els.pickedCount.textContent = `${count} 次`;
      } catch (err) {
        console.error("[撿取] 次數載入失敗", err);
        const count = await syncPickCount(note);
        els.pickedCount.textContent = `${count} 次`;
      }
      updateNearbyAlert();
    }

    async function openRepliesSheet() {
      if (!selectedNote) return;
      closeReplyComposeDrawer();
      openSheet("replies");

      const cached = repliesCache.get(selectedNote.id);
      if (cached?.length) {
        selectedReplies = cached;
        renderReplies();
        updateReplyEntryCount();
      } else if (selectedReplies.length) {
        renderReplies();
        updateReplyEntryCount();
      } else if ((selectedNote.replyCount || 0) > 0) {
        els.replyList.innerHTML = '<p class="muted">載入回覆中…</p>';
      } else {
        renderReplies();
      }

      try {
        await startRepliesListener(selectedNote);
      } catch (err) {
        console.error("[回覆] 載入失敗", err);
        if (!selectedReplies.length && (selectedNote.replyCount || 0) > 0) {
          els.replyList.innerHTML = '<p class="muted">回覆載入失敗，請稍後再試</p>';
        }
      } finally {
        renderRepliesIfOpen();
        updateReplyEntryCount();
      }
    }

    function updateReplyEntryCount() {
      const count = selectedReplies.length || selectedNote?.replyCount || 0;
      if (els.replyEntryCount) els.replyEntryCount.textContent = String(count);
