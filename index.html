<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe4d2" />
  <title>丟紙條 JZT</title>

  <!-- 中文襯線字體（手寫信紙感）-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Long+Cang&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQFu7uzU8yvepu9ZjY3OWnQafElyD4="
    crossorigin=""
  />

  <style>
    /* ============================================================
       設計語言：手寫信紙 · 揉皺紙團 · 朱印章紅
       配色：暖米紙 + 墨黑 + 印章朱紅
       字體：Noto Serif TC（內文）+ Long Cang（裝飾手寫）
       ============================================================ */
    :root {
      --paper:        #fbf3e1;   /* 主紙底色 */
      --paper-light:  #fffaf0;   /* 抽屜/卡片底色 */
      --paper-dark:   #e8d8b8;   /* 紙張陰影 */
      --ink:          #2b231d;   /* 墨黑 */
      --ink-soft:     #5a4a3a;   /* 次要文字 */
      --muted:        #9b8a72;   /* 灰調文字 */
      --line:         #d9c7a5;   /* 分隔線 */
      --line-soft:    #ece0c5;
      --seal:         #b8312c;   /* 印章朱紅（主強調色） */
      --seal-deep:    #8a201c;   /* 深朱紅（按下/陰影） */
      --seal-green:   #2e6d40;   /* 印章青綠（自己紙條）*/
      --gold:         #b08642;   /* 古銅金（裝飾） */
      --shadow-paper: 0 2px 8px rgba(75, 56, 35, 0.08), 0 14px 36px rgba(75, 56, 35, 0.14);
      --shadow-deep:  0 8px 24px rgba(75, 56, 35, 0.18), 0 20px 48px rgba(75, 56, 35, 0.22);

      font-family: "Noto Serif TC", "Songti TC", "PingFang TC", "Microsoft JhengHei", serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--paper);
      /* 紙張纖維紋理 */
      background-image:
        radial-gradient(circle at 20% 30%, rgba(176, 134, 66, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(184, 49, 44, 0.03) 0%, transparent 60%),
        repeating-linear-gradient(
          45deg,
          transparent 0,
          transparent 2px,
          rgba(75, 56, 35, 0.008) 2px,
          rgba(75, 56, 35, 0.008) 3px
        );
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ========== 地圖 ========== */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      /* 微微暖色濾鏡，讓 OSM 地圖貼合整體調性 */
      filter: sepia(0.08) saturate(0.9) brightness(1.02);
    }

    /* 必要的 Leaflet 內聯樣式 */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow,
    .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas,
    .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer {
      position: absolute; left: 0; top: 0;
    }
    .leaflet-container {
      overflow: hidden;
      touch-action: pan-x pan-y;
      background: #e8dcc0;
      font-family: inherit;
    }
    .leaflet-tile { visibility: hidden; border: 0; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-animated { transform-origin: 0 0; }
    .leaflet-interactive { cursor: pointer; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: auto; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-control-zoom, .leaflet-control-attribution { display: none; }

    /* ========== 頂部「投條」欄 ========== */
    .top-bar {
      position: absolute;
      z-index: 500;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .city-button {
      pointer-events: auto;
      max-width: min(440px, 100%);
      min-width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--paper-light);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-paper);
      color: var(--ink);
      font-weight: 500;
      font-size: 15px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .city-button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(75, 56, 35, 0.12);
    }

    .city-button::before {
      content: "";
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      background: var(--seal);
      mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z'/></svg>") no-repeat center / contain;
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z'/></svg>") no-repeat center / contain;
    }

    .city-button #cityText {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-button #locateText {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(176, 134, 66, 0.1);
      border: 1px solid var(--line-soft);
    }

    /* ========== 右側懸浮控制鈕（垂直三鈕）========== */
    .side-controls {
      position: absolute;
      z-index: 500;
      right: 14px;
      bottom: calc(140px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--paper-light);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-paper);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .side-button:active {
      transform: scale(0.92);
      background: var(--paper-dark);
    }

    .side-button svg {
      width: 22px;
      height: 22px;
    }

    /* 定位鈕在使用中變朱紅色 */
    .side-button.locating {
      background: var(--seal);
      color: white;
      border-color: var(--seal-deep);
    }

    /* ========== 底部三欄導航 ========== */
    .bottom-bar {
      position: absolute;
      z-index: 500;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 0 calc(8px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      pointer-events: none;
      /* 漸層讓底部更柔和 */
      background: linear-gradient(to top, rgba(251, 243, 225, 0.96) 30%, rgba(251, 243, 225, 0) 100%);
    }

    .bottom-tab {
      pointer-events: auto;
      background: transparent;
      border: 0;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      justify-self: center;
      min-width: 64px;
    }

    .bottom-tab svg {
      width: 24px;
      height: 24px;
    }

    .bottom-tab.left { justify-self: start; padding-left: 24px; }
    .bottom-tab.right { justify-self: end; padding-right: 24px; }

    .bottom-tab.active { color: var(--seal); }

    /* ★ 中央大紙團按鈕 ★ */
    .throw-paper-ball {
      pointer-events: auto;
      background: none;
      border: 0;
      padding: 0;
      width: 112px;
      height: 112px;
      position: relative;
      transform: translateY(-12px);  /* 浮出底欄 */
      cursor: pointer;
      filter: drop-shadow(0 8px 16px rgba(75, 56, 35, 0.28));
      animation: paperFloat 4s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .throw-paper-ball img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .throw-paper-ball:active {
      transform: translateY(-8px) scale(0.92);
      animation: none;
    }

    @keyframes paperFloat {
      0%, 100% { transform: translateY(-12px) rotate(-2deg); }
      50%      { transform: translateY(-16px) rotate(2deg); }
    }

    /* ========== Marker 樣式 ========== */
    /* 別人的紙條 (📃)：朱印章紅邊框 */
    .paper-marker {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      background:
        radial-gradient(circle at 30% 30%, #fffaee 0%, #f4e4be 60%, #d9bf85 100%);
      border: 2px solid var(--seal);
      border-radius: 8px 10px 7px 9px;
      box-shadow:
        inset -2px -3px 6px rgba(184, 49, 44, 0.15),
        inset 2px 2px 4px rgba(255, 255, 255, 0.7),
        0 6px 14px rgba(184, 49, 44, 0.32);
      transform: rotate(-6deg);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .paper-marker:hover { transform: rotate(-6deg) scale(1.1); }

    /* 自己的紙條 (📜)：青綠邊框（印章綠）*/
    .paper-marker.mine {
      background:
        radial-gradient(circle at 30% 30%, #f0fbf2 0%, #cee9d3 60%, #88b894 100%);
      border-color: var(--seal-green);
      box-shadow:
        inset -2px -3px 6px rgba(46, 109, 64, 0.18),
        inset 2px 2px 4px rgba(255, 255, 255, 0.7),
        0 6px 14px rgba(46, 109, 64, 0.4);
    }

    /* 圖片紙條：顯示縮圖 */
    .paper-marker.image-marker {
      width: 44px;
      height: 44px;
      padding: 3px;
      background: #fffaee;
      border-radius: 8px;
      transform: rotate(-4deg);
    }
    .paper-marker.image-marker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      pointer-events: none;
      user-select: none;
    }

    /* 朱印標記（右上角小點）*/
    .paper-marker::before {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      width: 10px;
      height: 10px;
      background: var(--seal);
      border-radius: 50%;
      border: 1.5px solid white;
      box-shadow: 0 1px 3px rgba(184, 49, 44, 0.5);
    }
    .paper-marker.mine::before {
      background: var(--seal-green);
      box-shadow: 0 1px 3px rgba(46, 109, 64, 0.5);
    }

    .user-marker {
      width: 18px;
      height: 18px;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--seal);
      box-shadow:
        0 0 0 4px rgba(184, 49, 44, 0.2),
        0 0 0 12px rgba(184, 49, 44, 0.08),
        0 4px 10px rgba(184, 49, 44, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(184, 49, 44, 0.2), 0 0 0 12px rgba(184, 49, 44, 0.08), 0 4px 10px rgba(184, 49, 44, 0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(184, 49, 44, 0.25), 0 0 0 18px rgba(184, 49, 44, 0.05), 0 4px 10px rgba(184, 49, 44, 0.4); }
    }

    /* ========== 底部抽屜 ========== */
    .sheet {
      position: absolute;
      z-index: 800;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: min(76vh, 600px);
      padding: 22px 22px calc(28px + env(safe-area-inset-bottom));
      border-radius: 24px 24px 0 0;
      background: var(--paper-light);
      box-shadow: var(--shadow-deep);
      overflow: auto;
      transform: translateY(105%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      /* 抽屜頂端裝飾條 */
      border-top: 1px solid var(--line);
    }
    .sheet.open { transform: translateY(0); }

    /* 抽屜頂部小握把 */
    .sheet::before {
      content: "";
      display: block;
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: -8px auto 14px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .sheet-header h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--ink);
      /* 朱印章下劃線 */
      position: relative;
      padding-left: 14px;
    }
    .sheet-header h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 22px;
      background: var(--seal);
      border-radius: 2px;
    }

    .close-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--paper-dark);
      color: var(--ink-soft);
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .close-button:active { background: var(--line); }

    /* ========== 表單元素 ========== */
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 14px;
      background: #fffefa;
      color: var(--ink);
      outline: none;
      font-size: 15px;
      line-height: 1.7;
      resize: vertical;
      /* 信紙橫線 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 28px,
        rgba(217, 199, 165, 0.35) 28px,
        rgba(217, 199, 165, 0.35) 29px
      );
      background-position: 0 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input { background-image: none; padding: 12px 14px; }

    textarea:focus, input:focus {
      border-color: var(--seal);
      box-shadow: 0 0 0 3px rgba(184, 49, 44, 0.1);
    }

    .throw-form, .picked-note, .reply-form {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .city-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 16px;
    }

    /* ========== 按鈕 ========== */
    .primary-button, .secondary-button, .danger-button {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.05em;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .primary-button {
      background: var(--seal);
      color: white;
      box-shadow: 0 4px 12px rgba(184, 49, 44, 0.32);
    }
    .primary-button:active {
      background: var(--seal-deep);
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(184, 49, 44, 0.3);
    }
    .primary-button:disabled {
      background: var(--paper-dark);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .secondary-button {
      background: var(--paper-dark);
      color: var(--ink);
    }
    .secondary-button:active {
      background: var(--line);
      transform: scale(0.97);
    }

    .danger-button {
      background: var(--ink);
      color: var(--paper);
      min-height: 40px;
      padding: 0 16px;
    }
    .danger-button:active {
      background: #000;
      transform: scale(0.97);
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* ========== 撿到紙條 ========== */
    .note-content {
      margin: 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        repeating-linear-gradient(to bottom, transparent 0, transparent 28px, rgba(217, 199, 165, 0.3) 28px, rgba(217, 199, 165, 0.3) 29px),
        linear-gradient(135deg, #fffefa 0%, #fff8e8 100%);
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 16px;
      color: var(--ink);
      box-shadow: inset 0 1px 3px rgba(75, 56, 35, 0.04);
      position: relative;
    }
    /* 朱印章標記 */
    .note-content::before {
      content: "私";
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--seal);
      color: white;
      font-weight: 900;
      font-size: 14px;
      border-radius: 4px;
      opacity: 0.75;
      transform: rotate(-8deg);
      box-shadow: 0 2px 4px rgba(184, 49, 44, 0.3);
    }

    .note-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0;
      padding: 12px 0;
      border-top: 1px dashed var(--line);
      border-bottom: 1px dashed var(--line);
    }
    .note-meta dt {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
    }
    .note-meta dd {
      margin: 6px 0 0;
      color: var(--ink);
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .reply-panel {
      display: grid;
      gap: 14px;
    }
    .reply-panel h3 {
      margin: 4px 0 0;
      font-size: 16px;
      color: var(--ink-soft);
      letter-spacing: 0.1em;
    }

    .reply-list {
      display: grid;
      gap: 10px;
      max-height: 200px;
      overflow: auto;
    }

    .reply-card {
      display: grid;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fffefa;
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--gold);
    }
    .reply-card p {
      margin: 0;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    .reply-card audio { width: 100%; }
    .reply-card small {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .sticker-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .sticker-button {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
      font-size: 24px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .sticker-button:active {
      transform: scale(0.88);
      background: var(--paper-dark);
    }

    /* 撿紙條底部動作列 */
    .pick-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px dashed var(--line);
    }
    .text-button {
      background: none;
      border: 0;
      padding: 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.05em;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
      align-self: center;
    }
    .text-button:active { color: var(--seal); }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    /* ========== 圖片預覽 ========== */
    .image-input-row {
      display: grid;
      gap: 10px;
    }
    input[type="file"] {
      padding: 10px 14px;
      background: var(--paper);
      border-style: dashed;
    }
    .image-preview, .picked-image {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fffefa;
    }

    /* ========== 城市搜尋結果 ========== */
    .result-row {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: #fffefa;
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      font-size: 14px;
      transition: background 0.15s ease;
    }
    .result-row:active { background: var(--paper-dark); }

    /* ========== 我的紙條頁 ========== */
    .page {
      position: absolute;
      z-index: 900;
      inset: 0;
      display: none;
      padding: 20px;
      background: var(--paper);
      overflow: auto;
    }
    .page.open { display: block; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: env(safe-area-inset-top);
    }
    .page-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .note-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .note-card {
      padding: 18px;
      border-radius: 14px;
      background: var(--paper-light);
      box-shadow: var(--shadow-paper);
      border: 1px solid var(--line-soft);
    }
    .note-card p {
      margin: 0 0 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .note-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* ========== 附近紙條提示 ========== */
    .alert {
      position: absolute;
      z-index: 500;
      left: 50%;
      bottom: 156px;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 12px 20px;
      color: white;
      background: var(--seal);
      box-shadow: 0 8px 24px rgba(184, 49, 44, 0.4);
      display: none;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-size: 14px;
      border: 0;
      animation: alertBounce 1.4s ease-in-out infinite;
    }
    .alert.show { display: block; }

    @keyframes alertBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-4px); }
    }

    /* ========== Toast ========== */
    .toast {
      position: absolute;
      z-index: 1000;
      left: 50%;
      top: max(80px, calc(env(safe-area-inset-top) + 70px));
      max-width: min(520px, calc(100% - 28px));
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 12px 20px;
      color: var(--paper);
      background: var(--ink);
      box-shadow: 0 10px 28px rgba(43, 35, 28, 0.3);
      display: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .toast.show {
      display: block;
      animation: toastIn 0.3s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 380px) {
      .note-meta { grid-template-columns: 1fr 1fr; }
      .bottom-tab.left { padding-left: 16px; }
      .bottom-tab.right { padding-right: 16px; }
      .throw-paper-ball { width: 100px; height: 100px; }
    }

    /* ========== 大圖標 SVG inline ========== */
    .icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>

        <!-- 底部：分享 + 檢舉 -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script type="module">
    /*
      你以後只需要改這一段 Firebase 設定。
      如果全部保持空白，網頁會用 demo 模式，資料只存在目前瀏覽器裡。
    */
    const firebaseConfig = {
      apiKey: "AIzaSyDZxsjJOwgAlc4OIOH01V7OZmQZhLldkxU",
      authDomain: "jztapp-31bb8.firebaseapp.com",
      projectId: "jztapp-31bb8",
      storageBucket: "jztapp-31bb8.firebasestorage.app",
      messagingSenderId: "501105409130",
      appId: "1:501105409130:web:d1418a3fa8f7ddad4f5e13"
    };

    /*
      ★ LIFF 設定 ★
      在 LINE Developers Console 建好 LIFF App 後，把它的 LIFF ID 填到下面
      格式像：1234567890-AbCdEfGh
      留空白 = 直接用網頁版（在 LINE 外面打開也能正常運作）
    */
    const LIFF_ID = "2010143431-l2kcIl8v";

    const hasFirebase = Boolean(
      firebaseConfig.apiKey &&
      firebaseConfig.authDomain &&
      firebaseConfig.projectId &&
      firebaseConfig.appId
    );

    let firebaseApi = null;
    let db = null;
    let auth = null;
    let currentUserId = localStorage.getItem("jzt_demo_uid") || crypto.randomUUID();
    localStorage.setItem("jzt_demo_uid", currentUserId);

    // === LIFF 初始化 ===
    // 如果在 LINE 內被打開、且有設 LIFF ID，就跑 LIFF init
    // 如果在外面瀏覽器打開，整段跳過、跟原本一樣運作
    let lineProfile = null;   // 將存放 { userId, displayName, pictureUrl } 之類資訊（可選用途）
    let inLiff = false;

    if (LIFF_ID && typeof liff !== "undefined") {
      try {
        await liff.init({ liffId: LIFF_ID });
        inLiff = liff.isInClient();
        console.log("[LIFF] 初始化完成，inClient =", inLiff);

        // 如果使用者還沒 login（一般網頁開啟 LIFF URL 時會發生），引導他登入
        if (!liff.isLoggedIn()) {
          // C 方案：登入是可選的——只有當使用者要綁定身份時才登入
          // 預設不強迫登入，這樣陌生人點連結進來也能立刻看地圖
          console.log("[LIFF] 未登入，使用匿名模式");
        } else {
          // 如果已經登入，把 LINE userId 當做穩定 UID
          // 這樣同一個人不同裝置打開 LIFF 都會是同一個 ID
          const profile = await liff.getProfile();
          lineProfile = profile;
          // 用 LINE userId 取代隨機 localStorage UID
          // 注意：這只是「ID 的來源」改變，不會洩漏給其他人
          currentUserId = `line_${profile.userId}`;
          localStorage.setItem("jzt_demo_uid", currentUserId);
          console.log("[LIFF] 已登入，userId =", profile.userId.slice(0, 6) + "...");
        }
      } catch (err) {
        console.error("[LIFF] 初始化失敗（不影響網頁版運作）", err);
      }
    }

    if (hasFirebase) {
      const appModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js");
      const authModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js");
      const firestoreModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js");
      const storageModule = await import("https://www.gstatic.com/firebasejs/11.2.0/firebase-storage.js");

      const app = appModule.initializeApp(firebaseConfig);
      auth = authModule.getAuth(app);
      db = firestoreModule.getFirestore(app);
      const storage = storageModule.getStorage(app);
      firebaseApi = { authModule, firestoreModule, storageModule, storage };

      await authModule.signInAnonymously(auth);

      // 重要：Firebase Auth 的 uid 跟我們的 currentUserId 不一定一樣
      // - 沒 LIFF 登入：currentUserId 用 Firebase 匿名 uid（之前邏輯）
      // - 有 LIFF 登入：currentUserId 用 line_xxx（跨裝置穩定）
      // 兩者都會存在 note.authorUid，安全規則只需要驗證 authorUid 等於前端宣稱的 ID
      if (!LIFF_ID || !lineProfile) {
        currentUserId = auth.currentUser.uid;
        localStorage.setItem("jzt_demo_uid", currentUserId);
      }
    }

    const taipei = { lat: 25.033, lng: 121.5654 };
    let currentLocation = { ...taipei };
    let currentCity = "台北";
    let notes = loadDemoNotes();
    let selectedNote = null;
    let selectedReplies = [];
    let markersLayer = null;
    let userMarker = null;

    const els = {
      cityButton: document.querySelector("#cityButton"),
      cityText: document.querySelector("#cityText"),
      locateText: document.querySelector("#locateText"),
      locateButton: document.querySelector("#locateButton"),
      refreshButton: document.querySelector("#refreshButton"),
      cityHopButton: document.querySelector("#cityHopButton"),
      nearbyListButton: document.querySelector("#nearbyListButton"),
      nearbySheet: document.querySelector("#nearbySheet"),
      nearbyList: document.querySelector("#nearbyList"),
      openThrowButton: document.querySelector("#openThrowButton"),
      throwSheet: document.querySelector("#throwSheet"),
      pickSheet: document.querySelector("#pickSheet"),
      citySheet: document.querySelector("#citySheet"),
      noteInput: document.querySelector("#noteInput"),
      imageInput: document.querySelector("#imageInput"),
      imagePreview: document.querySelector("#imagePreview"),
      countText: document.querySelector("#countText"),
      submitNoteButton: document.querySelector("#submitNoteButton"),
      throwForm: document.querySelector("#throwForm"),
      pickedContent: document.querySelector("#pickedContent"),
      pickedCity: document.querySelector("#pickedCity"),
      pickedCount: document.querySelector("#pickedCount"),
      pickedTime: document.querySelector("#pickedTime"),
      replyList: document.querySelector("#replyList"),
      replyForm: document.querySelector("#replyForm"),
      replyInput: document.querySelector("#replyInput"),
      replyCountText: document.querySelector("#replyCountText"),
      submitReplyButton: document.querySelector("#submitReplyButton"),
      stickerRow: document.querySelector("#stickerRow"),
      shareNoteButton: document.querySelector("#shareNoteButton"),
      reportNoteButton: document.querySelector("#reportNoteButton"),
      nearbyAlert: document.querySelector("#nearbyAlert"),
      myNotesButton: document.querySelector("#myNotesButton"),
      myNotesPage: document.querySelector("#myNotesPage"),
      myNotesList: document.querySelector("#myNotesList"),
      backButton: document.querySelector("#backButton"),
      cityForm: document.querySelector("#cityForm"),
      cityInput: document.querySelector("#cityInput"),
      cityResults: document.querySelector("#cityResults"),
      toast: document.querySelector("#toast")
    };

    const map = L.map("map", { zoomControl: false }).setView([taipei.lat, taipei.lng], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);
    userMarker = L.marker([taipei.lat, taipei.lng], {
      icon: L.divIcon({
        className: "",
        html: '<div class="user-marker"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      })
    }).addTo(map);

    els.cityButton.addEventListener("click", () => openSheet("city"));
    els.cityHopButton.addEventListener("click", () => openSheet("city"));
    els.locateButton.addEventListener("click", locateMe);
    els.refreshButton.addEventListener("click", async () => {
      els.refreshButton.style.transform = "rotate(360deg)";
      els.refreshButton.style.transition = "transform 0.6s ease";
      await refreshNotes();
      setTimeout(() => {
        els.refreshButton.style.transform = "";
        els.refreshButton.style.transition = "";
      }, 600);
      showToast("已重新整理");
    });
    els.openThrowButton.addEventListener("click", () => openSheet("throw"));
    els.myNotesButton.addEventListener("click", showMyNotes);
    els.nearbyListButton.addEventListener("click", showNearbyList);
    els.backButton.addEventListener("click", () => els.myNotesPage.classList.remove("open"));
    els.nearbyAlert.addEventListener("click", pickNearestNote);
    els.replyInput.addEventListener("input", () => {
      const left = 140 - els.replyInput.value.length;
      els.replyCountText.textContent = `${left} 字`;
      els.submitReplyButton.disabled = els.replyInput.value.trim().length === 0;
    });
    els.replyForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = els.replyInput.value.trim().slice(0, 140);
      if (!content || !selectedNote) return;
      await submitReply({ type: "text", content });
      els.replyInput.value = "";
      els.replyCountText.textContent = "140 字";
      els.submitReplyButton.disabled = true;
    });
    els.stickerRow.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-sticker]");
      if (!button || !selectedNote) return;
      await submitReply({ type: "sticker", content: button.dataset.sticker });
    });

    // === 分享紙條給 LINE 朋友 ===
    els.shareNoteButton.addEventListener("click", async () => {
      if (!selectedNote) return;
      const previewText = (selectedNote.content || "圖片紙條").slice(0, 30);

      // 如果在 LIFF 內，用 LINE 的分享選擇器；否則 fallback 到網頁分享
      if (inLiff && typeof liff !== "undefined" && liff.isApiAvailable("shareTargetPicker")) {
        try {
          await liff.shareTargetPicker([{
            type: "text",
            text: `我在丟紙條撿到一張：「${previewText}」\n${window.location.href}`
          }]);
          showToast("已分享");
        } catch (err) {
          console.error(err);
          showToast("分享失敗");
        }
      } else if (navigator.share) {
        try {
          await navigator.share({
            title: "丟紙條",
            text: `我撿到一張紙條：「${previewText}」`,
            url: window.location.href
          });
        } catch (err) {
          // 使用者取消分享，不算錯誤
        }
      } else {
        // 最後手段：複製連結
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast("已複製連結");
        } catch {
          showToast("無法分享");
        }
      }
    });

    // === 檢舉紙條 ===
    els.reportNoteButton.addEventListener("click", async () => {
      if (!selectedNote) return;
      if (!confirm("確定要檢舉這張紙條？\n達到 3 次檢舉會自動下架。")) return;
      try {
        await reportNote(selectedNote);
        showToast("已收到檢舉，謝謝你");
        closeSheets();
        await refreshNotes();
      } catch (err) {
        console.error(err);
        showToast("檢舉失敗");
      }
    });
    document.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", closeSheets);
    });

    els.noteInput.addEventListener("input", () => {
      const left = 140 - els.noteInput.value.length;
      els.countText.textContent = `${left} 字`;
      updateThrowButton();
    });

    els.imageInput.addEventListener("change", () => {
      const file = els.imageInput.files?.[0];
      if (!file) {
        els.imagePreview.hidden = true;
        els.imagePreview.removeAttribute("src");

      if (!content && !imageFile) return;

      // 注意：這只擋一般使用者，懂技術的人可以繞過。
      // 想真正鎖死要寫 Firestore 規則 + Cloud Function。

      const usage = JSON.parse(localStorage.getItem("jzt_daily_usage") || "{}");
      const todayCount = usage.date === today ? (usage.count || 0) : 0;
      if (todayCount >= DAILY_LIMIT) {
        showToast(`今天已經扔 ${DAILY_LIMIT} 張了，明天再來吧`);
        return;
      }

      const note = {
        id: crypto.randomUUID(),
        authorUid: currentUserId,
        type: imageFile ? "image" : "text",
        content,
        imageUrl: "",
        location: { ...currentLocation },
        city: currentCity,
        createdAt: new Date().toISOString(),
        expiresAt: addDays(new Date(), 30).toISOString(),
        pickedCount: 0,
        replyCount: 0,
        isSeed: false
      };

      try {
        // 加上「處理中」狀態，避免使用者以為按鈕沒反應
        els.submitNoteButton.disabled = true;

          note.imageUrl = await uploadNoteImage(imageFile);

        }
        await saveNote(note);
        notes.unshift(note);
        saveDemoNotes();

        // 更新今日扔紙條次數
        localStorage.setItem("jzt_daily_usage", JSON.stringify({
          date: today,
          count: todayCount + 1
        }));

        els.noteInput.value = "";
        els.imageInput.value = "";
        els.imagePreview.hidden = true;
        els.imagePreview.removeAttribute("src");
        els.countText.textContent = "140 字";
        els.submitNoteButton.textContent = "扔出去";
        closeSheets();
        renderNotes();
        const remaining = DAILY_LIMIT - todayCount - 1;
        showToast(`紙條已輕輕放下（今日剩 ${remaining} 次）`);

        console.error("[扔紙條失敗]", error);

        els.locateButton.classList.remove("locating");

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          currentLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          currentCity = await reverseCity(currentLocation);
          map.setView([currentLocation.lat, currentLocation.lng], 15);
          userMarker.setLatLng([currentLocation.lat, currentLocation.lng]);
          await refreshNotes();
          els.locateText.textContent = "重新定位";
          els.locateButton.classList.remove("locating");

        async () => {

          els.locateText.textContent = "重新定位";
          els.locateButton.classList.remove("locating");

      } catch (error) {

        showToast("Firebase 讀取失敗，先顯示測試紙條");
        notes = loadDemoNotes();
      }

      const nearbyCount = notes.filter((note) => distanceMeters(currentLocation, note.location) <= 300).length;
      if (!hasFirebase && nearbyCount === 0) {
        notes = [...seedNotes(currentLocation, currentCity), ...notes];
      }

      renderNotes();

    function renderNotes() {
      markersLayer.clearLayers();

      notes.forEach((note) => {
        const isMine = note.authorUid === currentUserId;
        const hasImage = note.imageUrl && note.type === "image";

        // 決定 marker HTML
        let markerHtml;
        let iconSize;
        if (hasImage) {
          // 圖片紙條：顯示縮圖
          const escapedUrl = note.imageUrl.replaceAll('"', '&quot;');
          markerHtml = `<div class="paper-marker image-marker ${isMine ? 'mine' : ''}"><img src="${escapedUrl}" alt="" /></div>`;
          iconSize = 44;
        } else {
          // 文字紙條：用 emoji 顯示
          const emoji = isMine ? "📜" : "📃";
          markerHtml = `<div class="paper-marker ${isMine ? 'mine' : ''}">${emoji}</div>`;
          iconSize = 36;
        }

        const marker = L.marker([note.location.lat, note.location.lng], {
          title: note.content || "圖片紙條",
          icon: L.divIcon({
            className: "",
            html: markerHtml,
            iconSize: [iconSize, iconSize],
            iconAnchor: [iconSize / 2, iconSize / 2]
          })
        });

        marker.on("click", () => pickNote(note));
        marker.addTo(markersLayer);
      });

      const nearby = notes.filter((note) => 
        note.authorUid !== currentUserId &&
        distanceMeters(currentLocation, note.location) <= 300
      );
      if (nearby.length > 0) {
        els.nearbyAlert.textContent = `附近有 ${nearby.length} 張紙條，點我撿起`;
        els.nearbyAlert.classList.add("show");
      } else {
        els.nearbyAlert.classList.remove("show");
      }
    }

    function pickNearestNote() {
      const nearest = notes
        .filter((note) => note.authorUid !== currentUserId)
        .map((note) => ({
          note,
          distance: distanceMeters(currentLocation, note.location)
        }))
        .filter((item) => item.distance <= 300)
        .sort((a, b) => a.distance - b.distance)[0];

      if (!nearest) {
        showToast("附近暫時沒有紙條");
        return;
      }

      pickNote(nearest.note);
    }

        note.pickedCount += 1;
        await updatePickedCount(note);
        saveDemoNotes();

      renderPickedNote(note);
      els.pickedCity.textContent = note.city;
      els.pickedCount.textContent = `${note.pickedCount} 次`;
      els.pickedTime.textContent = new Date(note.createdAt).toLocaleString("zh-TW");
      selectedReplies = await loadReplies(note);
      renderReplies();
      openSheet("pick");

    async function saveNote(note) {
      if (!hasFirebase) return;
      const {
        addDoc,
        collection,
        GeoPoint,
        serverTimestamp,
        Timestamp
      } = firebaseApi.firestoreModule;

      const expiresAt = addDays(new Date(), 30);
      const docRef = await addDoc(collection(db, "notes"), {
        authorUid: currentUserId,
        type: note.type,
        content: note.content,
        imageUrl: note.imageUrl || "",
        location: new GeoPoint(note.location.lat, note.location.lng),
        city: note.city,
        geohash: `${note.location.lat.toFixed(3)},${note.location.lng.toFixed(3)}`,
        createdAt: serverTimestamp(),
        expiresAt: Timestamp.fromDate(expiresAt),
        pickedCount: 0,
        replyCount: 0,
        isSeed: false,
        lastDriftAt: serverTimestamp()
      });
      note.id = docRef.id;

    /**
     * 把圖片檔案壓縮並轉成 base64 data URL
     * 為什麼這樣做：直接存 base64 到 Firestore，繞過 Storage 規則設定
     * Firestore 單一文件上限 1MB，所以一定要壓縮
     *   - 縮到最長邊 1024px
     *   - JPEG 品質 0.75
     *   - 一般手機照片壓完約 80-200KB
     */
    async function uploadNoteImage(file) {
      const dataUrl = await compressImageToDataUrl(file, 1024, 0.75);
      const sizeKb = Math.round(dataUrl.length * 0.75 / 1024);  // base64 約 4/3 倍
      console.log(`[圖片] 壓縮後約 ${sizeKb} KB`);

      // Firestore 限制 1MB，留點餘裕，超過 800KB 拒絕
      if (dataUrl.length > 800 * 1024) {
        throw new Error(`圖片壓縮後仍太大（${sizeKb} KB），請換一張`);
      }
      return dataUrl;
    }

    function compressImageToDataUrl(file, maxSide = 1024, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let { width, height } = img;
            // 等比縮到最長邊不超過 maxSide
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round(height * maxSide / width);
                width = maxSide;
              } else {
                width = Math.round(width * maxSide / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function deleteMyNote(note) {
      notes = notes.filter((item) => item.id !== note.id);
      saveDemoNotes();

      if (!hasFirebase || note.id.startsWith("seed-")) return;
      if (note.authorUid !== currentUserId) {
        showToast("只能刪除自己的紙條");
        return;
      }

      const { deleteDoc, doc } = firebaseApi.firestoreModule;
      await deleteDoc(doc(db, "notes", note.id));
    }

    async function saveReply(note, reply) {
      if (!hasFirebase || note.id.startsWith("seed-")) {
        const key = `jzt_replies_${note.id}`;
        const saved = JSON.parse(localStorage.getItem(key) || "[]");
        saved.unshift(reply);
        localStorage.setItem(key, JSON.stringify(saved));
        return;
      }

      const {
        addDoc,
        collection,
        doc,
        increment,
        serverTimestamp,
        updateDoc
      } = firebaseApi.firestoreModule;

      await addDoc(collection(db, "notes", note.id, "replies"), {
        authorUid: currentUserId,
        type: reply.type,
        content: reply.content,
        createdAt: serverTimestamp()
      });

      await updateDoc(doc(db, "notes", note.id), {
        replyCount: increment(1)
      });
    }

    async function loadReplies(note) {
      if (!hasFirebase || note.id.startsWith("seed-")) {
        const key = `jzt_replies_${note.id}`;
        return JSON.parse(localStorage.getItem(key) || "[]");
      }

      const {
        collection,
        getDocs,
        limit,
        orderBy,
        query
      } = firebaseApi.firestoreModule;

      const snapshot = await getDocs(
        query(
          collection(db, "notes", note.id, "replies"),
          orderBy("createdAt", "desc"),
          limit(30)
        )
      );

      return snapshot.docs.map((doc) => {
        const data = doc.data();
        return {
          id: doc.id,
          authorUid: data.authorUid,
          type: data.type,
          content: data.content,
          createdAt: data.createdAt?.toDate?.().toISOString() || new Date().toISOString()
        };
      });
    }

    async function loadFirebaseNotes() {
      const {
        collection,
        getDocs,
        limit,
        orderBy,
        query
      } = firebaseApi.firestoreModule;

      const snapshot = await getDocs(
        query(
          collection(db, "notes"),
          orderBy("createdAt", "desc"),
          limit(100)
        )
      );

      const all = snapshot.docs.map((doc) => {
        const data = doc.data();
        return {
          id: doc.id,
          authorUid: data.authorUid,
          type: data.type,
          content: data.content,
          imageUrl: data.imageUrl || "",
          location: {
            lat: data.location.latitude,
            lng: data.location.longitude
          },
          city: data.city,
          createdAt: data.createdAt?.toDate?.().toISOString() || new Date().toISOString(),
          expiresAt: data.expiresAt?.toDate?.().toISOString() || addDays(new Date(), 30).toISOString(),
          pickedCount: data.pickedCount || 0,
          replyCount: data.replyCount || 0,
          reportCount: data.reportCount || 0,
          isSeed: Boolean(data.isSeed)
        };
      });

      // 過濾掉被檢舉 3 次以上的紙條
      // 例外：自己丟的還是看得到（讓使用者知道自己被檢舉了）
      return all.filter((note) =>
        note.reportCount < 3 || note.authorUid === currentUserId
      );
    }

    // === 檢舉紙條：用 array 記錄誰檢舉過，避免重複檢舉 ===
    async function reportNote(note) {
      if (note.id.startsWith("seed-")) {
        showToast("這是示範紙條，無法檢舉");
        return;
      }
      if (!hasFirebase) {
        showToast("Demo 模式無法檢舉");
        return;
      }
      const { doc, updateDoc, arrayUnion, increment } = firebaseApi.firestoreModule;
      await updateDoc(doc(db, "notes", note.id), {
        reportedBy: arrayUnion(currentUserId),
        reportCount: increment(1)
      });
    }

    async function updatePickedCount(note) {
      if (!hasFirebase || note.id.startsWith("seed-")) return;
      const { doc, increment, updateDoc } = firebaseApi.firestoreModule;
      await updateDoc(doc(db, "notes", note.id), {
        pickedCount: increment(1)
      });
    }

    async function reverseCity(location) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/reverse");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("lat", String(location.lat));
        url.searchParams.set("lon", String(location.lng));
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.address?.city || data.address?.town || data.address?.county || data.address?.state || "附近";
      } catch {
        return "附近";
      }
    }

    async function searchCity(keyword) {
      try {
        const url = new URL("https://nominatim.openstreetmap.org/search");
        url.searchParams.set("format", "jsonv2");
        url.searchParams.set("q", keyword);
        url.searchParams.set("limit", "5");
        url.searchParams.set("accept-language", "zh-TW");
        const response = await fetch(url);
        const data = await response.json();
        return data.map((item) => ({
          city: item.display_name.split(",")[0],
          center: { lat: Number(item.lat), lng: Number(item.lon) }
        }));
      } catch {
        return [];
      }
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function distanceMeters(a, b) {
      const earthRadius = 6371000;
      const toRad = (value) => value * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const h = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * earthRadius * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
